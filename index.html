<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 WINTER Bday desktop</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
      background: #008080 url('https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g') no-repeat center center;
      background-size: cover;
    }
    .top-actions {
      position: absolute;
      top: 10px; left: 10px;
      display: flex; gap: 6px;
      z-index: 1000; flex-wrap: wrap;
    }
    .desktop {
      position: absolute;
      top: 55px; left: 15px; right: 15px; bottom: 40px;
      display: flex; flex-direction: column; flex-wrap: wrap;
      align-content: flex-start; gap: 16px;
    }
    .icon-wrapper {
      position: relative;
      width: 80px;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; text-align: center;
      color: white; text-shadow: 1px 1px 2px black;
    }
    .icon-wrapper.drag-hover {
      outline: 2px dashed #ffff00;
      background: rgba(255, 255, 255, 0.25);
    }
    .icon-wrapper img {
      width: 44px; height: 44px; object-fit: contain; pointer-events: none;
    }
    .icon-wrapper span {
      font-size: 11px; padding: 2px 4px; margin-top: 4px; word-break: break-all;
    }
    .icon-tools {
      display: none; position: absolute; top: -8px; right: -4px; gap: 2px;
    }
    body.admin-mode .icon-wrapper:hover .icon-tools { display: flex; }
    .icon-tools button { font-size: 9px; padding: 1px 3px; cursor: pointer; }
    .admin-only { display: none; }
    body.admin-mode .admin-only { display: inline-block; }
    
    .win-modal {
      position: absolute; display: none; z-index: 10;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.4);
    }
    .win-modal.maximized {
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: calc(100vh - 35px) !important;
      z-index: 500 !important;
    }
    .win-modal.maximized .window-body {
      height: calc(100% - 32px);
      overflow: auto;
    }
    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 35px;
      background: #c0c0c0; border-top: 2px solid #fff;
      display: flex; align-items: center; padding: 2px 6px; z-index: 999;
    }

    /* WINTER01 XP 開始選單 */
    .start-menu {
      position: fixed;
      bottom: 35px;
      left: 2px;
      width: 220px;
      background: #c0c0c0;
      border: 2px outset #fff;
      box-shadow: 3px 3px 12px rgba(0,0,0,0.5);
      display: none;
      z-index: 10000;
      padding: 3px;
    }
    .start-menu-banner {
      background: linear-gradient(180deg, #104e8b, #1e90ff);
      color: #fff;
      font-weight: bold;
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: 4px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .start-menu ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .start-menu li {
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .start-menu li:hover {
      background: #000080;
      color: #fff;
    }

    /* 播放清單 */
    .playlist-box {
      list-style: none; margin: 8px 0 0 0; padding: 0;
      background: #fff; border: 2px inset #dfdfdf; height: 130px; overflow-y: auto;
    }
    .playlist-box li {
      padding: 5px 8px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .playlist-box li:hover { background: #000080; color: #fff; }
    .playlist-box li.active { background: #000080; color: #fff; font-weight: bold; }

    /* 圖片編輯調色板 */
    .photo-filter-bar {
      display: flex; gap: 8px; flex-wrap: wrap; background: #dfdfdf;
      padding: 6px; margin-bottom: 6px; border: 1px solid #888; font-size: 11px; align-items: center;
    }
    .photo-filter-bar label { display: flex; align-items: center; gap: 3px; }
  </style>
</head>
<body>

  <!-- 頂部管理工具列 -->
  <div class="top-actions">
    <button id="authBtn" onclick="toggleAdmin()">🔒 管理員登入</button>
    <button class="admin-only" onclick="createItem('folder')">+ 資料夾/CD</button>
    <button class="admin-only" onclick="createItem('video')">+ 音樂/影片</button>
    <button class="admin-only" onclick="createItem('image')">+ 圖片</button>
    <button class="admin-only" onclick="createItem('note')">+ 便利貼</button>
    <button class="admin-only" onclick="createItem('link')">+ 外部連結</button>
    <button class="admin-only" onclick="changeWallpaper()">🎨 換背景</button>
    <button class="admin-only" style="background:#000080; color:#fff; font-weight:bold;" onclick="exportCurrentState()">💾 匯出設定 (永久儲存)</button>
  </div>

  <!-- 桌面容器 -->
  <div class="desktop" id="desktopContainer"></div>

  <!-- WINTER01 XP 開始選單（點擊直接跳轉開啟） -->
  <div id="startMenu" class="start-menu">
    <div class="start-menu-banner">⭐ WINTER01 XP</div>
    <ul>
      <li onclick="jumpToItem('folder', 'f1')">📁 開啟 WINTER 資料夾</li>
      <li onclick="jumpToItem('playlist', null)">🎵 開啟 Playlist 播放器</li>
      <li onclick="jumpToItem('image', 'img1')">🖼️ 開啟 手幅Serenade ver</li>
      <li onclick="jumpToItem('note', 'n1')">📝 開啟 生咖應援物便利貼</li>
      <li onclick="jumpToItem('link', 'l1')">🔗 開啟 生咖預約表單</li>
      <hr style="margin: 4px 0;">
      <li onclick="toggleAdmin(); toggleStartMenu();">⚙️ 切換管理員模式</li>
    </ul>
  </div>

  <!-- 資料夾 / CD 內容視窗 -->
  <div id="folder-win" class="window win-modal" style="top: 70px; left: 70px; width: 480px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="folderTitle">📁 資料夾</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('folder-win')"></button>
        <button aria-label="Close" onclick="closeWindow('folder-win')"></button>
      </div>
    </div>
    <div class="window-body">
      <div style="margin-bottom: 8px; display:flex; gap:6px; align-items:center;" class="admin-only">
        <button onclick="createItemInsideFolder('folder')">+ 子資料夾/CD</button>
        <button onclick="createItemInsideFolder('video')">+ 音樂/影片</button>
        <button onclick="createItemInsideFolder('image')">+ 圖片</button>
        <button onclick="createItemInsideFolder('note')">+ 便利貼</button>
      </div>
      <div id="folderInnerContent" style="display:flex; gap:12px; flex-wrap:wrap; min-height:140px; padding:10px; background:#fff; border: 2px inset #dfdfdf;"></div>
    </div>
  </div>

  <!-- 圖片檢視器（支援位置、大小縮放、簡易調色） -->
  <div id="photo-viewer-win" class="window win-modal" style="top: 60px; left: 100px; width: 560px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="photoViewerTitle">🖼️ 圖片檢視器</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('photo-viewer-win')"></button>
        <button aria-label="Close" onclick="closeWindow('photo-viewer-win')"></button>
      </div>
    </div>
    <div class="window-body" style="background: #2b2b2b; padding: 6px;">
      <div class="photo-filter-bar">
        <label>縮放: <input type="range" id="filterZoom" min="50" max="180" value="100" oninput="applyPhotoFilters()"></label>
        <label>亮度: <input type="range" id="filterBright" min="50" max="150" value="100" oninput="applyPhotoFilters()"></label>
        <label>對比: <input type="range" id="filterContrast" min="50" max="150" value="100" oninput="applyPhotoFilters()"></label>
        <label>飽和度: <input type="range" id="filterSat" min="0" max="200" value="100" oninput="applyPhotoFilters()"></label>
        <button onclick="resetPhotoFilters()">重設</button>
      </div>
      <div style="text-align: center; overflow: auto; max-height: 65vh; padding: 10px; display:flex; justify-content:center; align-items:center;">
        <img id="largePhotoDisplay" src="" style="max-width: 100%; height: auto; transition: 0.1s; border: 2px solid #fff;" alt="preview">
      </div>
    </div>
  </div>

  <!-- 影音播放器（全螢幕適配 16:9，修正縮小與停頓問題） -->
  <div id="media-player-win" class="window win-modal" style="top: 70px; left: 100px; width: 720px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="mediaViewerTitle">🎬 播放器</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('media-player-win')"></button>
        <button aria-label="Close" onclick="closeUniversalPlayer()"></button>
      </div>
    </div>
    <div class="window-body" style="background: #000; padding: 0; display: flex; flex-direction:column; height: 420px;">
      <iframe id="universalIframe" style="width: 100%; height: 100%; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      <video id="universalVideo" controls style="width: 100%; height: 100%; display:none;"></video>
    </div>
  </div>

  <!-- Playlist 播放器視窗（強化寬度與流暢度） -->
  <div id="playlist-win" class="window win-modal" style="top: 80px; left: 120px; width: 680px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="playlistTitleBar">🎵 Playlist 播放器</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('playlist-win')"></button>
        <button aria-label="Close" onclick="closeWindow('playlist-win')"></button>
      </div>
    </div>
    <div class="window-body" style="padding: 6px;">
      <div style="height: 340px; background:#000; width:100%; display:flex; align-items:center; justify-content:center;">
        <iframe id="playlistIframe" style="width: 100%; height: 100%; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div style="margin-top: 6px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; font-weight:bold;">曲目列表：</span>
        <button class="admin-only" onclick="addMusicTrack()">+ 新增曲目</button>
      </div>
      <ul class="playlist-box" id="playlistItems"></ul>
    </div>
  </div>

  <!-- 外部連結跳轉確認視窗 -->
  <div id="link-win" class="window win-modal" style="top: 120px; left: 160px; width: 280px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="linkTitle">🔗 外部連結</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeWindow('link-win')"></button>
      </div>
    </div>
    <div class="window-body" style="text-align:center;">
      <p id="linkText" style="font-size:12px;"></p>
      <a id="linkBtn" href="#" target="_blank" style="text-decoration:none;">
        <button style="width:100%; padding:6px;">Visit Site</button>
      </a>
    </div>
  </div>

  <!-- 底部工作列：WINTER 按鈕 -->
  <div class="taskbar">
    <button onclick="toggleStartMenu()" style="font-weight:bold; display:flex; align-items:center; gap:5px; height:26px; padding:0 6px;">
      <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" width="16" height="16"> WINTER
    </button>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin";
    let isAdmin = false;
    let currentOpenFolderId = null;

    // 專屬生咖預約表單圖示 (經典白紙藍色像素 W 圖示)
    const W_FORM_ICON = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M10 4 h20 l10 10 v30 h-30 Z' fill='%23ffffff' stroke='%23000000' stroke-width='2'/><path d='M30 4 v10 h10' fill='%23dfdfdf' stroke='%23000000' stroke-width='2'/><text x='13' y='35' font-family='Arial Black, sans-serif' font-size='22' font-weight='bold' fill='%230000ff'>W</text></svg>";

    /* ========== 核心永久儲存資料區 ========== */
    const MASTER_CONFIG = {
      "wallpaper": "https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g",
      "playlist": [
        {
          "title": "Winter-Speed of summer",
          "src": "YTeFLKMnwjg",
          "type": "youtube"
        },
        {
          "title": "新曲目",
          "src": "https://drive.google.com/file/d/1jeg0LS14Swh44kU4ymm7L5hU3kP_TJxj/preview",
          "type": "drive"
        }
      ],
      "items": [
        {
          "id": "item_playlist_core",
          "parentId": null,
          "type": "playlist",
          "name": "Playlist",
          "icon": "https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-4.png"
        },
        {
          "id": "f1",
          "parentId": null,
          "type": "folder",
          "name": "WINTER",
          "icon": "https://win98icons.alexmeub.com/icons/png/directory_open_file_mydocs-4.png"
        },
        {
          "id": "img1",
          "parentId": null,
          "type": "image",
          "name": "手幅Serenade ver",
          "icon": "https://lh3.googleusercontent.com/d/1sitVj0KVurInlsBz9BoIj1xA279bc9kS",
          "mediaUrl": "https://lh3.googleusercontent.com/d/1sitVj0KVurInlsBz9BoIj1xA279bc9kS"
        },
        {
          "id": "n1",
          "parentId": null,
          "type": "note",
          "name": "生咖應援物",
          "icon": "https://win98icons.alexmeub.com/icons/png/notepad-5.png",
          "content": "1. 應援小卡\n2. 明信片"
        },
        {
          "id": "l1",
          "parentId": null,
          "type": "link",
          "name": "生咖預約表單",
          "icon": W_FORM_ICON,
          "url": "https://dynamic-otter-22aaaa.netlify.app/"
        },
        {
          "id": "1789205032583",
          "parentId": null,
          "type": "folder",
          "name": "Winter Playlist",
          "icon": "https://win98icons.alexmeub.com/icons/png/cd_drive-5.png",
          "content": "",
          "url": "",
          "mediaUrl": ""
        }
      ]
    };
    /* ======================================= */

    const CONFIG_KEY = "winter_desktop_config_v7";
    let currentConfig = JSON.parse(localStorage.getItem(CONFIG_KEY)) || MASTER_CONFIG;
    let playlist = currentConfig.playlist;
    let itemsData = currentConfig.items;
    let currentTrackIdx = 0;

    // 提取 Google Drive 檔案 ID
    function extractDriveId(url) {
      if (!url) return null;
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                    url.match(/id=([a-zA-Z0-9_-]+)/) ||
                    url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function autoFormatMediaUrl(url, type) {
      if (!url) return url;
      const driveId = extractDriveId(url);
      if (driveId) {
        if (type === 'image' || type === 'icon' || type === 'wallpaper') {
          return `https://lh3.googleusercontent.com/d/${driveId}`;
        } else {
          return `https://drive.google.com/file/d/${driveId}/preview`;
        }
      }
      return url.trim();
    }

    function saveState() {
      currentConfig.playlist = playlist;
      currentConfig.items = itemsData;
      localStorage.setItem(CONFIG_KEY, JSON.stringify(currentConfig));
      renderDesktop();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
    }

    function exportCurrentState() {
      currentConfig.playlist = playlist;
      currentConfig.items = itemsData;
      const output = `const MASTER_CONFIG = ${JSON.stringify(currentConfig, null, 2)};`;

      navigator.clipboard.writeText(output).then(() => {
        alert("✅ 成功複製完整設定！請至 GitHub index.html 替換 MASTER_CONFIG 並 Commit changes。");
      }).catch(() => {
        prompt("請複製以下代碼並貼回 index.html：", output);
      });
    }

    // WINTER 開始選單控制
    function toggleStartMenu() {
      const menu = document.getElementById('startMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('startMenu');
      const startBtn = document.querySelector('.taskbar button');
      if (!menu.contains(e.target) && !startBtn.contains(e.target)) {
        menu.style.display = 'none';
      }
    });

    // WINTER01 XP 開始選單直接跳轉開啟
    function jumpToItem(type, id) {
      toggleStartMenu();
      if (type === 'playlist') {
        openWindow('playlist-win');
        return;
      }
      const item = itemsData.find(i => i.id === id);
      if (item) {
        handleItemClick(item);
      } else {
        alert("找不到該項目！");
      }
    }

    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        document.body.classList.remove('admin-mode');
        document.getElementById('authBtn').innerText = "🔒 管理員登入";
        alert("已退出管理員模式");
      } else {
        const input = prompt("請輸入管理員密碼：");
        if (input === ADMIN_PASSWORD) {
          isAdmin = true;
          document.body.classList.add('admin-mode');
          document.getElementById('authBtn').innerText = "🔓 退出管理";
          alert("登入成功！已解鎖所有編輯與新增功能。");
        } else if (input !== null) {
          alert("密碼錯誤！");
        }
      }
      renderDesktop();
      renderPlaylistUI();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
    }

    function renderDesktop() {
      const container = document.getElementById('desktopContainer');
      container.innerHTML = '';

      itemsData.filter(item => !item.parentId).forEach(item => {
        const el = createIconElement(item);
        container.appendChild(el);
      });
    }

    function createIconElement(item) {
      const div = document.createElement('div');
      div.className = 'icon-wrapper dynamic-item';
      div.draggable = isAdmin;

      const displayIcon = (item.type === 'image' && item.mediaUrl) ? item.mediaUrl : item.icon;

      div.innerHTML = `
        <div class="icon-tools">
          <button onclick="event.stopPropagation(); editItem('${item.id}')">✏️</button>
          <button onclick="event.stopPropagation(); deleteItem('${item.id}')">❌</button>
        </div>
        <img src="${displayIcon}" alt="icon" onerror="this.src='https://win98icons.alexmeub.com/icons/png/file_lines-0.png'">
        <span>${item.name}</span>
      `;

      div.onclick = () => handleItemClick(item);

      div.ondragstart = (e) => {
        if (!isAdmin) return;
        e.dataTransfer.setData('text/plain', item.id);
      };

      if (item.type === 'folder') {
        div.ondragover = (e) => { e.preventDefault(); div.classList.add('drag-hover'); };
        div.ondragleave = () => div.classList.remove('drag-hover');
        div.ondrop = (e) => {
          e.preventDefault();
          div.classList.remove('drag-hover');
          const draggedId = e.dataTransfer.getData('text/plain');
          if (draggedId && draggedId !== item.id) {
            const target = itemsData.find(i => i.id === draggedId);
            if (target) {
              target.parentId = item.id;
              saveState();
              alert(`已將「${target.name}」移入「${item.name}」！`);
            }
          }
        };
      }
      return div;
    }

    function handleItemClick(item) {
      if (item.type === 'folder') {
        openFolder(item.id, item.name);
      } else if (item.type === 'playlist') {
        openWindow('playlist-win');
      } else if (item.type === 'image') {
        openPhotoViewer(item.name, item.mediaUrl);
      } else if (item.type === 'video') {
        openUniversalPlayer(item.name, item.mediaUrl);
      } else if (item.type === 'note') {
        alert(`【${item.name}】\n\n${item.content}`);
      } else if (item.type === 'link') {
        document.getElementById('linkTitle').innerText = `🔗 ${item.name}`;
        document.getElementById('linkText').innerText = `即將前往：${item.url}`;
        document.getElementById('linkBtn').href = item.url;
        openWindow('link-win');
      }
    }

    // 播放影片（填滿高畫質，解除停頓問題）
    function openUniversalPlayer(title, url) {
      document.getElementById('mediaViewerTitle').innerText = `🎬 播放中：${title}`;
      const iframe = document.getElementById('universalIframe');
      const video = document.getElementById('universalVideo');

      if (url.includes('drive.google.com') || url.includes('youtube.com') || url.includes('youtu.be')) {
        let finalSrc = url;
        if (url.includes('youtube.com') || url.includes('youtu.be')) {
          let vid = url;
          if (url.includes("v=")) vid = url.split("v=")[1].substring(0, 11);
          else if (url.includes("youtu.be/")) vid = url.split("youtu.be/")[1].substring(0, 11);
          finalSrc = `https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&enablejsapi=1&rel=0`;
        }
        video.pause();
        video.style.display = 'none';
        iframe.style.display = 'block';
        if (iframe.src !== finalSrc) iframe.src = finalSrc;
      } else {
        iframe.src = '';
        iframe.style.display = 'none';
        video.style.display = 'block';
        video.src = url;
        video.play().catch(()=>{});
      }
      openWindow('media-player-win');
    }

    function closeUniversalPlayer() {
      document.getElementById('universalIframe').src = '';
      const v = document.getElementById('universalVideo');
      v.pause();
      v.src = '';
      closeWindow('media-player-win');
    }

    // 相片檢視與簡易濾鏡調色
    function openPhotoViewer(title, url) {
      document.getElementById('photoViewerTitle').innerText = `🖼️ 檢視圖片：${title}`;
      const img = document.getElementById('largePhotoDisplay');
      img.src = url;
      resetPhotoFilters();
      openWindow('photo-viewer-win');
    }

    function applyPhotoFilters() {
      const zoom = document.getElementById('filterZoom').value;
      const bright = document.getElementById('filterBright').value;
      const contrast = document.getElementById('filterContrast').value;
      const sat = document.getElementById('filterSat').value;
      const img = document.getElementById('largePhotoDisplay');

      img.style.transform = `scale(${zoom / 100})`;
      img.style.filter = `brightness(${bright}%) contrast(${contrast}%) saturate(${sat}%)`;
    }

    function resetPhotoFilters() {
      document.getElementById('filterZoom').value = 100;
      document.getElementById('filterBright').value = 100;
      document.getElementById('filterContrast').value = 100;
      document.getElementById('filterSat').value = 100;
      applyPhotoFilters();
    }

    // 資料夾內部操作
    function openFolder(folderId, folderName) {
      currentOpenFolderId = folderId;
      document.getElementById('folderTitle').innerText = `📁 ${folderName}`;
      renderFolderContent(folderId);
      openWindow('folder-win');
    }

    function renderFolderContent(folderId) {
      const box = document.getElementById('folderInnerContent');
      box.innerHTML = '';
      const children = itemsData.filter(i => i.parentId === folderId);

      if (children.length === 0) {
        box.innerHTML = '<span style="font-size:12px; color:#888; padding:10px;">此處為空（可拖曳檔案或 Playlist 進來）</span>';
        return;
      }

      children.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.style.cssText = 'display:flex; flex-direction:column; align-items:center; width:72px; cursor:pointer; text-align:center; position:relative;';
        const displayIcon = (item.type === 'image' && item.mediaUrl) ? item.mediaUrl : item.icon;
        itemEl.innerHTML = `
          <img src="${displayIcon}" style="width:40px; height:40px; object-fit:contain; border-radius:3px;">
          <span style="font-size:11px; margin-top:3px; word-break:break-all;">${item.name}</span>
          ${isAdmin ? `
            <div style="display:flex; gap:2px; margin-top:3px;">
              <button style="font-size:9px;" onclick="event.stopPropagation(); editItem('${item.id}')">✏️</button>
              <button style="font-size:9px;" onclick="event.stopPropagation(); moveBackToDesktop('${item.id}')">移出</button>
              <button style="font-size:9px;" onclick="event.stopPropagation(); deleteItem('${item.id}')">❌</button>
            </div>` : ''}
        `;
        itemEl.onclick = () => handleItemClick(item);
        box.appendChild(itemEl);
      });
    }

    function moveBackToDesktop(id) {
      const it = itemsData.find(i => i.id === id);
      if (it) {
        it.parentId = null;
        saveState();
      }
    }

    function createItem(type) {
      addItem(type, null);
    }
    function createItemInsideFolder(type) {
      if (!currentOpenFolderId) return;
      addItem(type, currentOpenFolderId);
    }

    function addItem(type, parentId) {
      const defaultTitle = type === 'folder' ? '新 CD / 資料夾' : (type === 'video' ? '新歌曲 / 影片' : '新項目');
      const name = prompt("請輸入名稱：", defaultTitle);
      if (!name) return;

      let icon = "", content = "", url = "", mediaUrl = "";

      if (type === 'folder') {
        const rawIcon = prompt("請輸入資料夾／CD 圖示網址 (留空使用經典光碟)：", "");
        icon = rawIcon ? autoFormatMediaUrl(rawIcon, 'icon') : "https://win98icons.alexmeub.com/icons/png/cd_drive-5.png";
      } else if (type === 'video') {
        const rawUrl = prompt("請貼上 YouTube 網址 或 Google 雲端影片共享連結：");
        if (!rawUrl) return;
        mediaUrl = autoFormatMediaUrl(rawUrl, 'video');
        const rawIcon = prompt("圖示網址 (留空使用預設影音圖示)：", "");
        icon = rawIcon ? autoFormatMediaUrl(rawIcon, 'icon') : "https://win98icons.alexmeub.com/icons/png/video_player_cool-0.png";
      } else if (type === 'image') {
        const rawUrl = prompt("請貼上圖片網址（支援 Google 雲端共享連結）：");
        if (!rawUrl) return;
        mediaUrl = autoFormatMediaUrl(rawUrl, 'image');
        icon = mediaUrl;
      } else if (type === 'note') {
        content = prompt("請輸入便利貼內文：", "寫下備忘...");
        const rawIcon = prompt("圖示網址 (留空預設)：", "");
        icon = rawIcon ? autoFormatMediaUrl(rawIcon, 'icon') : "https://win98icons.alexmeub.com/icons/png/notepad-5.png";
      } else if (type === 'link') {
        url = prompt("請輸入完整跳轉網址 (含 https://)：", "https://");
        const rawIcon = prompt("圖示網址 (留空預設)：", "");
        icon = rawIcon ? autoFormatMediaUrl(rawIcon, 'icon') : W_FORM_ICON;
      }

      itemsData.push({ id: Date.now().toString(), parentId, type, name, icon, content, url, mediaUrl });
      saveState();
    }

    function editItem(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;

      const newName = prompt("重新命名：", item.name);
      if (newName) item.name = newName;

      const rawIcon = prompt("更改圖示網址 (PNG/JPG/雲端)：", item.icon);
      if (rawIcon) item.icon = autoFormatMediaUrl(rawIcon, 'icon');

      if (item.type === 'video') {
        const rawMedia = prompt("更改音樂／影片連結 (YouTube 或 Google雲端)：", item.mediaUrl);
        if (rawMedia) item.mediaUrl = autoFormatMediaUrl(rawMedia, 'video');
      } else if (item.type === 'image') {
        const rawMedia = prompt("更改圖片網址：", item.mediaUrl);
        if (rawMedia) {
          item.mediaUrl = autoFormatMediaUrl(rawMedia, 'image');
          item.icon = item.mediaUrl;
        }
      } else if (item.type === 'link') {
        const u = prompt("更改跳轉網址：", item.url);
        if (u) item.url = u;
      } else if (item.type === 'note') {
        const c = prompt("更改便利貼內文：", item.content);
        if (c !== null) item.content = c;
      }

      saveState();
    }

    function deleteItem(id) {
      if (confirm("確定刪除此項目嗎？")) {
        itemsData = itemsData.filter(i => i.id !== id && i.parentId !== id);
        saveState();
      }
    }

    // Playlist 播放清單
    function renderPlaylistUI() {
      const listEl = document.getElementById('playlistItems');
      listEl.innerHTML = '';
      playlist.forEach((track, idx) => {
        const li = document.createElement('li');
        li.className = idx === currentTrackIdx ? 'active' : '';
        li.innerHTML = `
          <span>${idx + 1}. ${track.title}</span>
          ${isAdmin ? `
            <div style="display:flex; gap:3px;">
              <button onclick="event.stopPropagation(); editTrack(${idx})">✏️</button>
              <button onclick="event.stopPropagation(); removeMusicTrack(${idx})">✕</button>
            </div>
          ` : ''}
        `;
        li.onclick = () => playTrack(idx);
        listEl.appendChild(li);
      });

      if (playlist.length > 0) {
        const current = playlist[currentTrackIdx];
        const iframe = document.getElementById('playlistIframe');
        document.getElementById('playlistTitleBar').innerText = `🎵 播放中：${current.title}`;
        
        let targetSrc = "";
        if (current.src.includes('drive.google.com')) {
          targetSrc = current.src;
        } else {
          targetSrc = `https://www.youtube-nocookie.com/embed/${current.src}?autoplay=1&enablejsapi=1&rel=0`;
        }
        if (iframe.src !== targetSrc) iframe.src = targetSrc;
      }
    }

    function playTrack(idx) {
      currentTrackIdx = idx;
      renderPlaylistUI();
    }

    function addMusicTrack() {
      const title = prompt("請輸入歌曲名稱：", "新曲目");
      if (!title) return;
      const link = prompt("請輸入 YouTube 連結 或 Google 雲端音訊/影片連結：");
      if (!link) return;

      let src = link.trim();
      const driveId = extractDriveId(link);
      if (driveId) {
        src = `https://drive.google.com/file/d/${driveId}/preview`;
      } else if (link.includes("v=")) {
        src = link.split("v=")[1].substring(0, 11);
      } else if (link.includes("youtu.be/")) {
        src = link.split("youtu.be/")[1].substring(0, 11);
      }

      playlist.push({ title, src, type: driveId ? "drive" : "youtube" });
      saveState();
      renderPlaylistUI();
    }

    function editTrack(idx) {
      const track = playlist[idx];
      const newTitle = prompt("修改曲目名稱：", track.title);
      if (newTitle) track.title = newTitle;
      const newLink = prompt("修改曲目連結：", track.src);
      if (newLink) {
        const driveId = extractDriveId(newLink);
        if (driveId) {
          track.src = `https://drive.google.com/file/d/${driveId}/preview`;
          track.type = "drive";
        } else if (newLink.includes("v=")) {
          track.src = newLink.split("v=")[1].substring(0, 11);
          track.type = "youtube";
        } else {
          track.src = newLink.trim();
        }
      }
      saveState();
      renderPlaylistUI();
    }

    function removeMusicTrack(idx) {
      if (confirm("刪除這首歌曲？")) {
        playlist.splice(idx, 1);
        if (currentTrackIdx >= playlist.length) currentTrackIdx = 0;
        saveState();
        renderPlaylistUI();
      }
    }

    function toggleMaximize(id) {
      document.getElementById(id).classList.toggle('maximized');
    }

    let highestZ = 20;
    function openWindow(id) {
      const win = document.getElementById(id);
      win.style.display = 'block';
      win.style.zIndex = ++highestZ;
    }
    function closeWindow(id) {
      document.getElementById(id).style.display = 'none';
    }
    function dragElement(elmnt, event) {
      if (elmnt.classList.contains('maximized')) return;
      elmnt.style.zIndex = ++highestZ;
      let pos1 = 0, pos2 = 0, pos3 = event.clientX, pos4 = event.clientY;
      document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
      document.onmousemove = (e) => {
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      };
    }

    function changeWallpaper() {
      const rawUrl = prompt("請輸入桌布圖片網址（支援 Google 雲端共享連結）：", "");
      if (rawUrl) {
        const finalUrl = autoFormatMediaUrl(rawUrl, 'wallpaper');
        document.body.style.backgroundImage = `url('${finalUrl}')`;
        currentConfig.wallpaper = finalUrl;
        saveState();
      }
    }

    if (currentConfig.wallpaper) {
      document.body.style.backgroundImage = `url('${currentConfig.wallpaper}')`;
    }
    renderDesktop();
    renderPlaylistUI();
  </script>
</body>
</html>
