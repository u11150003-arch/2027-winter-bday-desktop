<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2027 WINTER Bday desktop</title>

  <!-- 5. 網址分享縮圖 (Open Graph / Twitter Card) -->
  <meta property="og:title" content="2027 WINTER Bday desktop">
  <meta property="og:description" content="A special retro desktop space created for WINTER">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1sitVj0KVurInlsBz9BoIj1xA279bc9kS">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://lh3.googleusercontent.com/d/1sitVj0KVurInlsBz9BoIj1xA279bc9kS">

  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
      background: #008080 url('https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g') no-repeat center center;
      background-size: cover;
    }
    
    /* 頂部操作工具列 */
    .top-actions {
      position: absolute;
      top: 6px; left: 6px; right: 6px;
      display: flex; gap: 4px;
      z-index: 1000; flex-wrap: nowrap;
      overflow-x: auto; padding-bottom: 4px;
    }
    .top-actions button {
      flex-shrink: 0; font-size: 11px; padding: 2px 6px; cursor: pointer;
    }

    /* 桌面容器 (支援自由絕對定位與觸控拖曳) */
    .desktop {
      position: absolute;
      top: 45px; left: 0; right: 0; bottom: 35px;
      overflow: hidden;
    }

    /* 圖示結構 */
    .icon-wrapper {
      position: absolute;
      width: 76px;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; text-align: center;
      color: white; text-shadow: 1px 1px 2px black;
      padding: 3px;
      border-radius: 2px;
      touch-action: none;
    }
    .icon-wrapper.selected {
      background: rgba(0, 0, 128, 0.45);
      outline: 1px dotted #ffff00;
    }
    .icon-wrapper.selected span {
      background: #000080; color: #fff;
    }
    .icon-wrapper.cut-mode {
      opacity: 0.45; filter: grayscale(80%);
    }

    /* 雙模式光碟圖示 (含自訂封面卡槽) */
    .icon-art-box {
      position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    }
    .icon-art-box .base-disc {
      width: 42px; height: 42px; object-fit: contain;
    }
    .icon-art-box .custom-cover-badge {
      position: absolute; width: 22px; height: 22px; object-fit: cover; border: 1px solid #fff; border-radius: 2px;
      bottom: 0; right: 0; box-shadow: 1px 1px 3px rgba(0,0,0,0.6);
    }

    .icon-wrapper span {
      font-size: 11px; padding: 1px 3px; margin-top: 3px; word-break: break-all;
    }

    .admin-only { display: none !important; }
    body.admin-mode .admin-only { display: inline-flex !important; }

    /* 視窗樣式與全螢幕還原 */
    .win-modal {
      position: fixed; display: none; z-index: 100;
      box-shadow: 2px 2px 12px rgba(0,0,0,0.5);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 94vw; max-width: 580px;
    }
    .win-modal .window-body {
      max-height: 75vh; overflow-y: auto; padding: 6px;
    }
    .win-modal.maximized {
      top: 0 !important; left: 0 !important; transform: none !important;
      width: 100vw !important; max-width: 100vw !important; height: calc(100vh - 35px) !important;
      z-index: 500 !important;
    }
    .win-modal.maximized .window-body {
      max-height: calc(100vh - 70px) !important;
    }

    /* 影音與相片容器 */
    .media-container {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #000; display: flex; align-items: center; justify-content: center;
    }
    .media-container iframe, .media-container video {
      width: 100%; height: 100%; border: none;
    }
    .photo-stage {
      width: 100%; min-height: 220px; max-height: 60vh;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a1a; overflow: hidden; padding: 6px;
    }
    .photo-stage img {
      max-width: 100%; max-height: 55vh; object-fit: contain; border: 1px solid #fff;
    }

    /* 底部工作列 */
    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 35px;
      background: #c0c0c0; border-top: 2px solid #fff;
      display: flex; align-items: center; justify-content: space-between; padding: 2px 6px; z-index: 999;
    }
    .taskbar-left {
      display: flex; align-items: center; gap: 4px;
    }
    .taskbar-right {
      font-size: 11px; display: flex; align-items: center; padding-right: 4px;
    }
    .taskbar-right a {
      color: #000; text-decoration: none; font-weight: bold; border-bottom: 1px dotted #555;
    }

    .playlist-box {
      list-style: none; margin: 8px 0 0 0; padding: 0;
      background: #fff; border: 2px inset #dfdfdf; height: 130px; overflow-y: auto;
    }
    .playlist-box li {
      padding: 5px 8px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .playlist-box li:hover { background: #000080; color: #fff; }
    .playlist-box li.active { background: #000080; color: #fff; font-weight: bold; }
  </style>
</head>
<body onclick="handleGlobalClick(event)">

  <!-- 頂部管理工具列 -->
  <div class="top-actions" onclick="event.stopPropagation()">
    <button id="authBtn" onclick="toggleAdmin()">🔒 管理員</button>
    <button class="admin-only" onclick="createItem('folder')">+ 資料夾</button>
    <button class="admin-only" onclick="createAlbumWithCoverChoice()">+ 專輯曲目庫</button>
    <button class="admin-only" onclick="createItem('video')">+ 音樂/影片</button>
    <button class="admin-only" onclick="createItem('image')">+ 圖片</button>
    <button class="admin-only" onclick="createItem('note')">+ 便利貼</button>
    <button class="admin-only" onclick="createItem('link')">+ 外部連結</button>

    <!-- 選取特定項目後啟用的控制功能 -->
    <span class="admin-only selected-ops" style="display:none; gap:3px;">
      <span style="color:#888; margin: 0 2px;">|</span>
      <button onclick="copySelectedItem()">📋 複製</button>
      <button onclick="cutSelectedItem()">✂️ 剪下</button>
      <button onclick="editSelectedItem()">✏️ 編輯</button>
      <button onclick="deleteSelectedItem()">❌ 刪除</button>
    </span>

    <button id="topPasteBtn" class="admin-only" style="display:none; background:#ffffe0;" onclick="pasteItem(null)">📌 貼到桌面</button>
    <button class="admin-only" onclick="changeWallpaper()">🎨 桌布</button>
    <button class="admin-only" style="background:#000080; color:#fff; font-weight:bold;" onclick="exportCurrentState()">💾 永久儲存</button>
  </div>

  <!-- 桌面容器 -->
  <div class="desktop" id="desktopContainer"></div>

  <!-- 資料夾視窗 -->
  <div id="folder-win" class="window win-modal" onclick="event.stopPropagation()">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="folderTitle">📁 資料夾</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('folder-win')"></button>
        <button aria-label="Close" onclick="closeWindow('folder-win')"></button>
      </div>
    </div>
    <div class="window-body">
      <div style="display:flex; gap:4px; align-items:center; margin-bottom:6px;" class="admin-only">
        <button onclick="createItemInsideFolder('folder')">+ 子資料夾</button>
        <button onclick="createAlbumWithCoverChoice(currentOpenFolderId)">+ 專輯曲目庫</button>
        <button onclick="createItemInsideFolder('video')">+ 音樂/影片</button>
        <button onclick="createItemInsideFolder('image')">+ 圖片</button>
        <button id="folderPasteBtn" style="display:none; background:#ffffe0;" onclick="pasteItem(currentOpenFolderId)">📌 貼上到此</button>
      </div>
      <div id="folderInnerContent" style="display:flex; gap:10px; flex-wrap:wrap; min-height:120px; padding:8px; background:#fff; border: 2px inset #dfdfdf;"></div>
    </div>
  </div>

  <!-- 專輯曲目播放器視窗 (支援自訂多首曲目與封面) -->
  <div id="album-win" class="window win-modal" onclick="event.stopPropagation()">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="albumTitleBar">💿 專輯曲目列表</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('album-win')"></button>
        <button aria-label="Close" onclick="closeWindow('album-win')"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="media-container">
        <iframe id="albumIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div style="margin-top:6px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; font-weight:bold;">曲目清單：</span>
        <button class="admin-only" onclick="addTrackToCurrentAlbum()">+ 新增曲目</button>
      </div>
      <ul class="playlist-box" id="albumTrackItems"></ul>
    </div>
  </div>

  <!-- 圖片檢視器 -->
  <div id="photo-viewer-win" class="window win-modal" onclick="event.stopPropagation()">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="photoViewerTitle">🖼️ 圖片檢視器</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('photo-viewer-win')"></button>
        <button aria-label="Close" onclick="closeWindow('photo-viewer-win')"></button>
      </div>
    </div>
    <div class="window-body" style="background: #222; padding: 4px;">
      <div class="photo-stage">
        <img id="largePhotoDisplay" src="" alt="preview">
      </div>
    </div>
  </div>

  <!-- 影音播放器 -->
  <div id="media-player-win" class="window win-modal" style="max-width: 640px;" onclick="event.stopPropagation()">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="mediaViewerTitle">🎬 播放器</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('media-player-win')"></button>
        <button aria-label="Close" onclick="closeUniversalPlayer()"></button>
      </div>
    </div>
    <div class="window-body" style="padding: 0; background: #000;">
      <div class="media-container">
        <iframe id="universalIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        <video id="universalVideo" controls playsinline></video>
      </div>
    </div>
  </div>

  <!-- 外部連結視窗 -->
  <div id="link-win" class="window win-modal" style="max-width: 320px;" onclick="event.stopPropagation()">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="linkTitle">🔗 外部連結</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeWindow('link-win')"></button>
      </div>
    </div>
    <div class="window-body" style="text-align:center;">
      <p id="linkText" style="font-size:12px; margin: 10px 0;"></p>
      <a id="linkBtn" href="#" target="_blank" style="text-decoration:none;">
        <button style="width:100%; padding:6px; font-weight:bold;">開啟連結 (Visit Site)</button>
      </a>
    </div>
  </div>

  <!-- 2. 底部工作列：含 HOME、WINTER 與 Copyright 連結 -->
  <div class="taskbar">
    <div class="taskbar-left">
      <!-- 回到首頁按鍵 -->
      <button onclick="goHome()" style="font-weight:bold; display:flex; align-items:center; gap:4px; height:26px; padding:0 6px;" title="關閉所有視窗回到桌面">
        ⭐️ HOME
      </button>
      <button onclick="goHome()" style="font-weight:bold; display:flex; align-items:center; gap:4px; height:26px; padding:0 6px;">
        <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" width="16" height="16"> WINTER
      </button>
    </div>
    <div class="taskbar-right">
      <a href="https://www.instagram.com/winter_tst" target="_blank">Copyright ©：winter_tst</a>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin";
    let isAdmin = false;
    let currentOpenFolderId = null;
    let currentOpenAlbumId = null;

    let selectedItemId = null;
    let clipboardItem = null;
    let isCutOperation = false;

    const ICON_FOLDER_DEFAULT = "https://win98icons.alexmeub.com/icons/png/directory_open_file_mydocs-4.png";
    const ICON_DISC_PURE = "https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-4.png";
    const ICON_DISC_DRIVE = "https://win98icons.alexmeub.com/icons/png/cd_drive-5.png";
    const W_FORM_ICON = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M10 4 h20 l10 10 v30 h-30 Z' fill='%23ffffff' stroke='%23000000' stroke-width='2'/><path d='M30 4 v10 h10' fill='%23dfdfdf' stroke='%23000000' stroke-width='2'/><text x='13' y='35' font-family='Arial Black, sans-serif' font-size='22' font-weight='bold' fill='%230000ff'>W</text></svg>";

    /* ========== 核心永久儲存配置 ========== */
    const MASTER_CONFIG = {
      "wallpaper": "https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g",
      "items": [
        {
          "id": "album_winter_speed",
          "parentId": null,
          "type": "album",
          "name": "Winter Playlist",
          "iconType": "cover", // cover 或 pure
          "icon": ICON_DISC_DRIVE,
          "coverBadge": "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=200",
          "pos": { x: 16, y: 16 },
          "tracks": [
            { "title": "Winter-Speed of summer", "src": "YTeFLKMnwjg", "type": "youtube" },
            { "title": "What you want do for love", "src": "https://drive.google.com/file/d/1jeg0LS14Swh44kU4ymm7L5hU3kP_TJxj/preview", "type": "drive" }
          ]
        },
        {
          "id": "f1",
          "parentId": null,
          "type": "folder",
          "name": "WINTER",
          "icon": ICON_FOLDER_DEFAULT,
          "pos": { x: 16, y: 92 }
        },
        {
          "id": "img1",
          "parentId": null,
          "type": "image",
          "name": "手幅Serenade ver",
          "icon": "https://lh3.googleusercontent.com/d/1sitVj0KVurInlsBz9BoIj1xA279bc9kS",
          "mediaUrl": "https://lh3.googleusercontent.com/d/1sitVj0KVurInlsBz9BoIj1xA279bc9kS",
          "pos": { x: 16, y: 168 }
        },
        {
          "id": "n1",
          "parentId": null,
          "type": "note",
          "name": "生咖應援物",
          "icon": "https://win98icons.alexmeub.com/icons/png/notepad-5.png",
          "content": "1. 應援小卡\n2. 明信片",
          "pos": { x: 16, y: 244 }
        },
        {
          "id": "l1",
          "parentId": null,
          "type": "link",
          "name": "生咖預約表單",
          "icon": W_FORM_ICON,
          "url": "https://dynamic-otter-22aaaa.netlify.app/",
          "pos": { x: 16, y: 320 }
        }
      ]
    };
    /* ===================================== */

    const CONFIG_KEY = "winter_desktop_config_v14";
    localStorage.setItem(CONFIG_KEY, JSON.stringify(MASTER_CONFIG));
    let currentConfig = MASTER_CONFIG;
    let itemsData = currentConfig.items;

    function extractDriveId(url) {
      if (!url) return null;
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function autoFormatMediaUrl(url, type) {
      if (!url) return url;
      const driveId = extractDriveId(url);
      if (driveId) {
        if (type === 'image' || type === 'icon' || type === 'wallpaper') return `https://lh3.googleusercontent.com/d/${driveId}`;
        return `https://drive.google.com/file/d/${driveId}/preview`;
      }
      return url.trim();
    }

    function saveState() {
      currentConfig.items = itemsData;
      localStorage.setItem(CONFIG_KEY, JSON.stringify(currentConfig));
      renderDesktop();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
      updateSelectionUI();
    }

    function exportCurrentState() {
      currentConfig.items = itemsData;
      const output = `const MASTER_CONFIG = ${JSON.stringify(currentConfig, null, 2)};`;
      navigator.clipboard.writeText(output).then(() => {
        alert("✅ 成功複製配置代碼！\n\n請至 GitHub index.html 替換 MASTER_CONFIG 區域即可永久儲存。");
      }).catch(() => {
        prompt("請複製代碼並貼回 index.html：", output);
      });
    }

    // 回到首頁（關閉所有視窗）
    function goHome() {
      document.querySelectorAll('.win-modal').forEach(win => win.style.display = 'none');
      currentOpenFolderId = null;
      currentOpenAlbumId = null;
    }

    function handleGlobalClick(e) {
      selectedItemId = null;
      updateSelectionUI();
      renderDesktop();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
    }

    function selectItem(id, e) {
      e.stopPropagation();
      selectedItemId = (selectedItemId === id) ? null : id;
      updateSelectionUI();
      renderDesktop();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
    }

    function updateSelectionUI() {
      const hasSelection = selectedItemId !== null && isAdmin;
      document.querySelectorAll('.selected-ops').forEach(el => el.style.display = hasSelection ? 'inline-flex' : 'none');

      const showPaste = isAdmin && clipboardItem !== null;
      const topBtn = document.getElementById('topPasteBtn');
      const folderBtn = document.getElementById('folderPasteBtn');
      if (topBtn) topBtn.style.display = showPaste ? 'inline-block' : 'none';
      if (folderBtn) folderBtn.style.display = showPaste ? 'inline-block' : 'none';
    }

    function copySelectedItem() {
      if (!selectedItemId) return;
      const item = itemsData.find(i => i.id === selectedItemId);
      if (!item) return;
      clipboardItem = item;
      isCutOperation = false;
      updateSelectionUI();
      alert(`已複製「${item.name}」！`);
    }

    function cutSelectedItem() {
      if (!selectedItemId) return;
      const item = itemsData.find(i => i.id === selectedItemId);
      if (!item) return;
      clipboardItem = item;
      isCutOperation = true;
      updateSelectionUI();
      renderDesktop();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
      alert(`已剪下「${item.name}」！`);
    }

    function editSelectedItem() {
      if (!selectedItemId) return;
      editItem(selectedItemId);
    }

    function deleteSelectedItem() {
      if (!selectedItemId) return;
      if (confirm("確定刪除所選項目嗎？")) {
        itemsData = itemsData.filter(i => i.id !== selectedItemId && i.parentId !== selectedItemId);
        if (clipboardItem && clipboardItem.id === selectedItemId) clipboardItem = null;
        selectedItemId = null;
        saveState();
      }
    }

    function pasteItem(targetParentId) {
      if (!clipboardItem) return;
      if (isCutOperation) {
        if (clipboardItem.id === targetParentId) { alert("無法將項目移入自己內部！"); return; }
        clipboardItem.parentId = targetParentId;
        clipboardItem = null;
        isCutOperation = false;
      } else {
        function cloneRecursive(origItem, pId) {
          const newId = "copy_" + Date.now() + "_" + Math.floor(Math.random()*1000);
          const cloned = { ...origItem, id: newId, parentId: pId, name: origItem.name + " (副本)" };
          if (cloned.pos) cloned.pos = { x: cloned.pos.x + 20, y: cloned.pos.y + 20 };
          itemsData.push(cloned);
          const children = itemsData.filter(i => i.parentId === origItem.id);
          children.forEach(ch => cloneRecursive(ch, newId));
        }
        cloneRecursive(clipboardItem, targetParentId);
      }
      selectedItemId = null;
      saveState();
    }

    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        document.body.classList.remove('admin-mode');
        document.getElementById('authBtn').innerText = "🔒 管理員";
        selectedItemId = null;
        alert("已退出管理員模式");
      } else {
        const input = prompt("請輸入管理員密碼：");
        if (input === ADMIN_PASSWORD) {
          isAdmin = true;
          document.body.classList.add('admin-mode');
          document.getElementById('authBtn').innerText = "🔓 退出管理";
          alert("登入成功！已解鎖自訂拖曳定位、新增專輯曲目庫與編輯功能。");
        } else if (input !== null) {
          alert("密碼錯誤！");
        }
      }
      renderDesktop();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
      updateSelectionUI();
    }

    // 桌面渲染與跨裝置（手機 Touch + 電腦 Mouse）拖曳定位
    function renderDesktop() {
      const container = document.getElementById('desktopContainer');
      container.innerHTML = '';

      itemsData.filter(item => !item.parentId).forEach((item, index) => {
        if (!item.pos) {
          const col = Math.floor(index / 5);
          const row = index % 5;
          item.pos = { x: 16 + col * 84, y: 16 + row * 76 };
        }
        const el = createIconElement(item);
        el.style.left = item.pos.x + "px";
        el.style.top = item.pos.y + "px";
        makeDraggable(el, item);
        container.appendChild(el);
      });
    }

    function createIconElement(item) {
      const div = document.createElement('div');
      const isSelected = selectedItemId === item.id;
      const isCut = clipboardItem && clipboardItem.id === item.id && isCutOperation;
      div.className = `icon-wrapper dynamic-item ${isSelected ? 'selected' : ''} ${isCut ? 'cut-mode' : ''}`;

      // 雙模式光碟圖示
      let iconHtml = "";
      if (item.type === 'album') {
        if (item.iconType === 'cover' && item.coverBadge) {
          iconHtml = `
            <div class="icon-art-box">
              <img src="${ICON_DISC_DRIVE}" class="base-disc">
              <img src="${item.coverBadge}" class="custom-cover-badge">
            </div>
          `;
        } else {
          iconHtml = `<div class="icon-art-box"><img src="${ICON_DISC_PURE}" class="base-disc"></div>`;
        }
      } else {
        const displayIcon = (item.type === 'image' && item.mediaUrl) ? item.mediaUrl : (item.icon || ICON_FOLDER_DEFAULT);
        iconHtml = `<img src="${displayIcon}" style="width:42px; height:42px; object-fit:contain;" onerror="this.src='${ICON_FOLDER_DEFAULT}'">`;
      }

      div.innerHTML = `${iconHtml}<span>${item.name}</span>`;

      div.onclick = (e) => {
        if (isAdmin) selectItem(item.id, e);
        else handleItemClick(item);
      };
      div.ondblclick = (e) => { e.stopPropagation(); handleItemClick(item); };
      return div;
    }

    // 跨裝置通用觸控/滑鼠拖曳定位
    function makeDraggable(el, item) {
      let isDragging = false;
      let startX, startY, origX, origY;

      function onStart(e) {
        if (!isAdmin) return;
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX;
        startY = clientY;
        origX = item.pos.x;
        origY = item.pos.y;
      }

      function onMove(e) {
        if (!isDragging || !isAdmin) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = clientX - startX;
        const dy = clientY - startY;
        el.style.left = (origX + dx) + "px";
        el.style.top = (origY + dy) + "px";
      }

      function onEnd(e) {
        if (!isDragging) return;
        isDragging = false;
        item.pos.x = parseInt(el.style.left);
        item.pos.y = parseInt(el.style.top);
        saveState();
      }

      el.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      el.addEventListener('touchstart', onStart, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onEnd);
    }

    function handleItemClick(item) {
      if (item.type === 'folder') {
        openFolder(item.id, item.name);
      } else if (item.type === 'album') {
        openAlbumPlayer(item);
      } else if (item.type === 'image') {
        openPhotoViewer(item.name, item.mediaUrl);
      } else if (item.type === 'video') {
        openUniversalPlayer(item.name, item.mediaUrl);
      } else if (item.type === 'note') {
        alert(`【${item.name}】\n\n${item.content}`);
      } else if (item.type === 'link') {
        document.getElementById('linkTitle').innerText = `🔗 ${item.name}`;
        document.getElementById('linkText').innerText = `即將前往：${item.url}`;
        document.getElementById('linkBtn').href = item.url;
        openWindow('link-win');
      }
    }

    // 4. 新增專輯曲目庫（含雙圖示選擇）
    function createAlbumWithCoverChoice(parentId = null) {
      const name = prompt("請輸入專輯名稱：", "My Album");
      if (!name) return;

      const choice = prompt("請選擇光碟圖示樣式：\n1. 經典純光碟\n2. 光碟機托盤＋自訂封面圖片", "1");
      let iconType = "pure";
      let coverBadge = "";

      if (choice === "2") {
        iconType = "cover";
        const rawCover = prompt("請貼上正方形封面圖片網址 (支援 Google 雲端共享連結)：", "");
        coverBadge = rawCover ? autoFormatMediaUrl(rawCover, 'image') : "";
      }

      const newAlbum = {
        id: "album_" + Date.now(),
        parentId: parentId,
        type: "album",
        name: name,
        iconType: iconType,
        icon: iconType === 'cover' ? ICON_DISC_DRIVE : ICON_DISC_PURE,
        coverBadge: coverBadge,
        tracks: [
          { title: "Sample Track", src: "YTeFLKMnwjg", type: "youtube" }
        ],
        pos: { x: 30, y: 30 }
      };

      itemsData.push(newAlbum);
      saveState();
      alert(`專輯「${name}」建立完成！雙擊該專輯即可播放或新增更多曲目。`);
    }

    // 開啟專輯播放器
    function openAlbumPlayer(albumItem) {
      currentOpenAlbumId = albumItem.id;
      document.getElementById('albumTitleBar').innerText = `💿 專輯：${albumItem.name}`;
      renderAlbumTrackList();
      openWindow('album-win');
    }

    function renderAlbumTrackList() {
      const album = itemsData.find(i => i.id === currentOpenAlbumId);
      if (!album || !album.tracks) return;

      const listEl = document.getElementById('albumTrackItems');
      listEl.innerHTML = '';
      album.tracks.forEach((track, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${idx + 1}. ${track.title}</span>
          ${isAdmin ? `<button onclick="event.stopPropagation(); removeAlbumTrack(${idx})">✕</button>` : ''}
        `;
        li.onclick = () => playAlbumTrack(track);
        listEl.appendChild(li);
      });

      if (album.tracks.length > 0) playAlbumTrack(album.tracks[0]);
    }

    function playAlbumTrack(track) {
      const iframe = document.getElementById('albumIframe');
      if (track.src.includes('drive.google.com')) {
        iframe.src = track.src;
      } else {
        iframe.src = `https://www.youtube-nocookie.com/embed/${track.src}?autoplay=1&enablejsapi=1&rel=0`;
      }
    }

    function addTrackToCurrentAlbum() {
      const album = itemsData.find(i => i.id === currentOpenAlbumId);
      if (!album) return;

      const title = prompt("請輸入歌曲名稱：", "New Track");
      if (!title) return;
      const link = prompt("請輸入 YouTube 影片連結 或 Google 雲端音訊連結：");
      if (!link) return;

      let src = link.trim();
      const driveId = extractDriveId(link);
      if (driveId) {
        src = `https://drive.google.com/file/d/${driveId}/preview`;
      } else if (link.includes("v=")) {
        src = link.split("v=")[1].substring(0, 11);
      } else if (link.includes("youtu.be/")) {
        src = link.split("youtu.be/")[1].substring(0, 11);
      }

      album.tracks.push({ title, src, type: driveId ? "drive" : "youtube" });
      saveState();
      renderAlbumTrackList();
    }

    function removeAlbumTrack(idx) {
      const album = itemsData.find(i => i.id === currentOpenAlbumId);
      if (!album) return;
      if (confirm("刪除這首歌曲？")) {
        album.tracks.splice(idx, 1);
        saveState();
        renderAlbumTrackList();
      }
    }

    // 視窗拖曳與關閉
    let highestZ = 200;
    function openWindow(id) {
      const win = document.getElementById(id);
      win.style.display = 'block';
      win.style.zIndex = ++highestZ;
    }
    function closeWindow(id) {
      document.getElementById(id).style.display = 'none';
    }
    function toggleMaximize(id) {
      const win = document.getElementById(id);
      win.classList.toggle('maximized');
    }

    function dragElement(elmnt, event) {
      if (elmnt.classList.contains('maximized') || window.innerWidth < 600) return;
      elmnt.style.zIndex = ++highestZ;
      let pos1 = 0, pos2 = 0, pos3 = event.clientX, pos4 = event.clientY;
      document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
      document.onmousemove = (e) => {
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      };
    }

    function openFolder(folderId, folderName) {
      currentOpenFolderId = folderId;
      document.getElementById('folderTitle').innerText = `📁 ${folderName}`;
      renderFolderContent(folderId);
      openWindow('folder-win');
    }

    function renderFolderContent(folderId) {
      const box = document.getElementById('folderInnerContent');
      box.innerHTML = '';
      const children = itemsData.filter(i => i.parentId === folderId);

      if (children.length === 0) {
        box.innerHTML = '<span style="font-size:12px; color:#888; padding:8px;">此資料夾為空</span>';
        return;
      }

      children.forEach(item => {
        const itemEl = createIconElement(item);
        itemEl.style.position = 'relative';
        box.appendChild(itemEl);
      });
    }

    function createItem(type) { addItem(type, null); }
    function createItemInsideFolder(type) { if (currentOpenFolderId) addItem(type, currentOpenFolderId); }

    function addItem(type, parentId) {
      const name = prompt("請輸入名稱：", "新項目");
      if (!name) return;
      let icon = "", content = "", url = "", mediaUrl = "";

      if (type === 'folder') icon = ICON_FOLDER_DEFAULT;
      else if (type === 'video') {
        const rawUrl = prompt("請貼上 YouTube 網址 或 Google 雲端影片共享連結：");
        if (!rawUrl) return;
        mediaUrl = autoFormatMediaUrl(rawUrl, 'video');
        icon = ICON_DISC_PURE;
      } else if (type === 'image') {
        const rawUrl = prompt("請貼上圖片網址（支援 Google 雲端共享連結）：");
        if (!rawUrl) return;
        mediaUrl = autoFormatMediaUrl(rawUrl, 'image');
        icon = mediaUrl;
      } else if (type === 'note') {
        content = prompt("請輸入便利貼內文：", "寫下備忘...");
        icon = "https://win98icons.alexmeub.com/icons/png/notepad-5.png";
      } else if (type === 'link') {
        url = prompt("請輸入完整跳轉網址 (含 https://)：", "https://");
        icon = W_FORM_ICON;
      }

      itemsData.push({ id: Date.now().toString(), parentId, type, name, icon, content, url, mediaUrl, pos: { x: 30, y: 30 } });
      saveState();
    }

    function editItem(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;
      const newName = prompt("重新命名：", item.name);
      if (newName) item.name = newName;
      if (item.type === 'image') {
        const raw = prompt("更改圖片網址：", item.mediaUrl);
        if (raw) { item.mediaUrl = autoFormatMediaUrl(raw, 'image'); item.icon = item.mediaUrl; }
      }
      saveState();
    }

    function openPhotoViewer(title, url) {
      document.getElementById('photoViewerTitle').innerText = `🖼️ ${title}`;
      document.getElementById('largePhotoDisplay').src = url;
      openWindow('photo-viewer-win');
    }

    function openUniversalPlayer(title, url) {
      document.getElementById('mediaViewerTitle').innerText = `🎬 ${title}`;
      const iframe = document.getElementById('universalIframe');
      const video = document.getElementById('universalVideo');

      if (url.includes('drive.google.com') || url.includes('youtube.com') || url.includes('youtu.be')) {
        let finalSrc = url;
        if (url.includes('youtube.com') || url.includes('youtu.be')) {
          let vid = url;
          if (url.includes("v=")) vid = url.split("v=")[1].substring(0, 11);
          else if (url.includes("youtu.be/")) vid = url.split("youtu.be/")[1].substring(0, 11);
          finalSrc = `https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&enablejsapi=1&rel=0`;
        }
        video.pause(); video.style.display = 'none';
        iframe.style.display = 'block';
        if (iframe.src !== finalSrc) iframe.src = finalSrc;
      } else {
        iframe.src = ''; iframe.style.display = 'none';
        video.style.display = 'block';
        video.src = url; video.play().catch(()=>{});
      }
      openWindow('media-player-win');
    }

    function closeUniversalPlayer() {
      document.getElementById('universalIframe').src = '';
      const v = document.getElementById('universalVideo');
      v.pause(); v.src = '';
      closeWindow('media-player-win');
    }

    function changeWallpaper() {
      const rawUrl = prompt("請輸入桌布圖片網址（支援 Google 雲端共享連結）：", "");
      if (rawUrl) {
        const finalUrl = autoFormatMediaUrl(rawUrl, 'wallpaper');
        document.body.style.backgroundImage = `url('${finalUrl}')`;
        currentConfig.wallpaper = finalUrl;
        saveState();
      }
    }

    // 初始化載入桌布與桌面
    if (currentConfig.wallpaper) {
      document.body.style.backgroundImage = `url('${currentConfig.wallpaper}')`;
    }
    renderDesktop();
  </script>
