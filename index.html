<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 WINTER Bday desktop</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
      background: #008080 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600') no-repeat center center;
      background-size: cover;
    }
    .top-actions {
      position: absolute;
      top: 10px; left: 10px;
      display: flex; gap: 6px;
      z-index: 1000; flex-wrap: wrap;
    }
    .desktop {
      position: absolute;
      top: 55px; left: 15px; right: 15px; bottom: 40px;
      display: flex; flex-direction: column; flex-wrap: wrap;
      align-content: flex-start; gap: 16px;
    }
    .icon-wrapper {
      position: relative;
      width: 80px;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; text-align: center;
      color: white; text-shadow: 1px 1px 2px black;
    }
    .icon-wrapper.drag-hover {
      outline: 2px dashed #ffff00;
      background: rgba(255, 255, 255, 0.25);
    }
    .icon-wrapper img {
      width: 44px; height: 44px; object-fit: contain; pointer-events: none;
    }
    .icon-wrapper span {
      font-size: 11px; padding: 2px 4px; margin-top: 4px; word-break: break-all;
    }
    .icon-tools {
      display: none; position: absolute; top: -8px; right: -4px; gap: 2px;
    }
    body.admin-mode .icon-wrapper:hover .icon-tools { display: flex; }
    .icon-tools button { font-size: 9px; padding: 1px 3px; cursor: pointer; }
    .admin-only { display: none; }
    body.admin-mode .admin-only { display: inline-block; }
    
    .win-modal {
      position: absolute; display: none; z-index: 10;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.4);
    }
    .win-modal.maximized {
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: calc(100vh - 35px) !important;
      z-index: 500 !important;
    }
    .win-modal.maximized .window-body {
      height: calc(100% - 30px);
      overflow: auto;
    }
    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 35px;
      background: #c0c0c0; border-top: 2px solid #fff;
      display: flex; align-items: center; padding: 2px 6px; z-index: 999;
    }
    .playlist-box {
      list-style: none; margin: 8px 0 0 0; padding: 0;
      background: #fff; border: 2px inset #dfdfdf; height: 110px; overflow-y: auto;
    }
    .playlist-box li {
      padding: 4px 8px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between;
    }
    .playlist-box li:hover { background: #000080; color: #fff; }
    .playlist-box li.active { background: #000080; color: #fff; font-weight: bold; }
    
    .converter-row {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; font-size: 12px;
    }
    .converter-row input { width: 100%; }
  </style>
</head>
<body>

  <!-- 工具列 -->
  <div class="top-actions">
    <button id="authBtn" onclick="toggleAdmin()">🔒 管理員登入</button>
    <button class="admin-only" onclick="createItem('folder')">+ 資料夾</button>
    <button class="admin-only" onclick="createItem('image')">+ 圖片</button>
    <button class="admin-only" onclick="createItem('video')">+ 影片 (MP4)</button>
    <button class="admin-only" onclick="createItem('note')">+ 便利貼</button>
    <button class="admin-only" onclick="createItem('link')">+ 外部連結</button>
    <button class="admin-only" onclick="changeWallpaper()">🎨 換背景</button>
    <button class="admin-only" style="background:#ff8000; color:#fff;" onclick="openWindow('converter-win')">🛠️ 雲端轉直連工具</button>
    <button class="admin-only" style="background:#000080; color:#fff; font-weight:bold;" onclick="exportCurrentState()">💾 匯出設定 (永久儲存)</button>
  </div>

  <!-- 桌面圖示容器 -->
  <div class="desktop" id="desktopContainer">
    <div class="icon-wrapper" onclick="openWindow('music-win')">
      <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-4.png" alt="music">
      <span>Playlist</span>
    </div>
  </div>

  <!-- 資料夾視窗 -->
  <div id="folder-win" class="window win-modal" style="top: 80px; left: 80px; width: 420px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="folderTitle">📁 資料夾</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('folder-win')"></button>
        <button aria-label="Close" onclick="closeWindow('folder-win')"></button>
      </div>
    </div>
    <div class="window-body">
      <div style="margin-bottom: 8px;" class="admin-only">
        <button onclick="createItemInsideCurrentFolder()">+ 在此資料夾新增項目</button>
      </div>
      <div id="folderInnerContent" style="display:flex; gap:12px; flex-wrap:wrap; min-height:120px; padding:8px; background:#fff; border: 2px inset #dfdfdf;"></div>
    </div>
  </div>

  <!-- 圖片檢視器 -->
  <div id="photo-viewer-win" class="window win-modal" style="top: 70px; left: 140px; width: 450px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="photoViewerTitle">🖼️ 圖片檢視器</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('photo-viewer-win')"></button>
        <button aria-label="Close" onclick="closeWindow('photo-viewer-win')"></button>
      </div>
    </div>
    <div class="window-body" style="text-align: center; background: #333; padding: 10px;">
      <img id="largePhotoDisplay" src="" style="max-width: 100%; max-height: 70vh; object-fit: contain; border: 2px solid #fff;" alt="preview">
    </div>
  </div>

  <!-- 影片播放器 (MP4 / M4A) -->
  <div id="video-player-win" class="window win-modal" style="top: 90px; left: 150px; width: 460px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="videoViewerTitle">🎬 影片播放器</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('video-player-win')"></button>
        <button aria-label="Close" onclick="closeVideoPlayer()"></button>
      </div>
    </div>
    <div class="window-body" style="background: #000; padding: 4px; text-align: center;">
      <video id="nativeVideoPlayer" controls style="width: 100%; max-height: 65vh;"></video>
    </div>
  </div>

  <!-- Google 雲端直連轉換器 -->
  <div id="converter-win" class="window win-modal" style="top: 110px; left: 180px; width: 440px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text">🛠️ Google 雲端直連轉換器</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeWindow('converter-win')"></button>
      </div>
    </div>
    <div class="window-body" style="padding: 12px;">
      <div class="converter-row">
        <label><b>1. 貼上 Google 雲端檔案共用連結：</b></label>
        <input type="text" id="driveInputUrl" placeholder="https://drive.google.com/file/d/.../view?usp=sharing" oninput="runConversion()">
      </div>
      <hr style="margin: 10px 0;">
      <div class="converter-row">
        <label><b>📷 圖片／Icon 專用直連網址：</b></label>
        <div style="display:flex; gap:4px;">
          <input type="text" id="driveImgOut" readonly>
          <button onclick="copyField('driveImgOut')">複製</button>
        </div>
      </div>
      <div class="converter-row">
        <label><b>🎬 影片（MP4）／音訊（MP3/M4A）專用直連網址：</b></label>
        <div style="display:flex; gap:4px;">
          <input type="text" id="driveMediaOut" readonly>
          <button onclick="copyField('driveMediaOut')">複製</button>
        </div>
      </div>
      <p style="font-size:11px; color:#555; margin-top:8px;">💡 提示：本網站所有輸入框皆已內建「自動轉換」，直接貼上 Google Drive 分享連結即可使用！</p>
    </div>
  </div>

  <!-- Playlist 音樂視窗 -->
  <div id="music-win" class="window win-modal" style="top: 100px; left: 120px; width: 380px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="nowPlayingTitle">🎵 Playlist 播放器</div>
      <div class="title-bar-controls">
        <button aria-label="Maximize" onclick="toggleMaximize('music-win')"></button>
        <button aria-label="Close" onclick="closeWindow('music-win')"></button>
      </div>
    </div>
    <div class="window-body">
      <div id="playerBox" style="min-height: 180px; display:flex; align-items:center; justify-content:center; background:#000;">
        <iframe id="ytPlayer" width="100%" height="180" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        <audio id="audioPlayer" controls style="width: 90%; display: none;"></audio>
      </div>
      <div style="margin-top: 6px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; font-weight:bold;">曲目清單：</span>
        <button class="admin-only" onclick="addMusicTrack()">+ 新增歌曲</button>
      </div>
      <ul class="playlist-box" id="playlistItems"></ul>
    </div>
  </div>

  <!-- 外部連結視窗 -->
  <div id="link-win" class="window win-modal" style="top: 120px; left: 160px; width: 280px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="linkTitle">🔗 外部連結</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeWindow('link-win')"></button>
      </div>
    </div>
    <div class="window-body" style="text-align:center;">
      <p id="linkText" style="font-size:12px;"></p>
      <a id="linkBtn" href="#" target="_blank" style="text-decoration:none;">
        <button style="width:100%; padding:6px;">Visit Site</button>
      </a>
    </div>
  </div>

  <!-- 底部工作列 -->
  <div class="taskbar">
    <button style="font-weight:bold; display:flex; align-items:center; gap:4px;">
      <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" width="16" height="16"> Start
    </button>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin";
    let isAdmin = false;
    let currentOpenFolderId = null;

    /* ========== 核心永久儲存資料區（已更新最新內容） ========== */
    const MASTER_CONFIG = {
      "wallpaper": "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600",
      "playlist": [
        {
          "title": "Winter-Speed of summer",
          "src": "YTeFLKMnwjg",
          "type": "youtube"
        }
      ],
      "items": [
        {
          "id": "f1",
          "parentId": null,
          "type": "folder",
          "name": "WINTER",
          "icon": "https://win98icons.alexmeub.com/icons/png/directory_open_file_mydocs-4.png"
        },
        {
          "id": "img1",
          "parentId": null,
          "type": "image",
          "name": "Winter 照片",
          "icon": "https://win98icons.alexmeub.com/icons/png/camera-2.png",
          "mediaUrl": "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800"
        },
        {
          "id": "n1",
          "parentId": null,
          "type": "note",
          "name": "生咖應援物",
          "icon": "https://win98icons.alexmeub.com/icons/png/notepad-5.png",
          "content": "1. 應援小卡\n2. 明信片"
        },
        {
          "id": "l1",
          "parentId": null,
          "type": "link",
          "name": "生咖預約表單",
          "icon": "https://win98icons.alexmeub.com/icons/png/html-2.png",
          "url": "https://dynamic-otter-22aaaa.netlify.app/"
        }
      ]
    };
    /* ========================================================== */

    // 每次更新程式碼時版本號遞增，確保立即清除舊快取
    const CURRENT_CONFIG_VERSION = "2026_09_12_v1";
    if (localStorage.getItem('desktop_version') !== CURRENT_CONFIG_VERSION) {
      localStorage.setItem('desktop_version', CURRENT_CONFIG_VERSION);
      localStorage.setItem('winter_desktop_config', JSON.stringify(MASTER_CONFIG));
    }

    // Google Drive 提取與轉直連工具
    function extractDriveId(url) {
      if (!url) return null;
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || 
                    url.match(/id=([a-zA-Z0-9_-]+)/) ||
                    url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function autoConvertDriveUrl(url, type) {
      if (!url || typeof url !== 'string') return url;
      const id = extractDriveId(url);
      if (!id) return url.trim();

      if (type === 'image' || type === 'icon' || type === 'wallpaper') {
        return `https://lh3.googleusercontent.com/d/${id}`;
      } else if (type === 'video' || type === 'audio') {
        return `https://drive.google.com/uc?export=download&id=${id}`;
      }
      return url.trim();
    }

    function runConversion() {
      const val = document.getElementById('driveInputUrl').value.trim();
      const id = extractDriveId(val);
      if (id) {
        document.getElementById('driveImgOut').value = `https://lh3.googleusercontent.com/d/${id}`;
        document.getElementById('driveMediaOut').value = `https://drive.google.com/uc?export=download&id=${id}`;
      } else {
        document.getElementById('driveImgOut').value = "";
        document.getElementById('driveMediaOut').value = "";
      }
    }

    function copyField(elementId) {
      const field = document.getElementById(elementId);
      if (!field.value) return;
      field.select();
      navigator.clipboard.writeText(field.value);
      alert("已複製直連網址！");
    }

    let currentConfig = JSON.parse(localStorage.getItem('winter_desktop_config')) || MASTER_CONFIG;
    let playlist = currentConfig.playlist;
    let itemsData = currentConfig.items;
    let currentTrackIdx = 0;

    function saveState() {
      currentConfig.playlist = playlist;
      currentConfig.items = itemsData;
      localStorage.setItem('winter_desktop_config', JSON.stringify(currentConfig));
      renderDesktop();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
    }

    function exportCurrentState() {
      currentConfig.playlist = playlist;
      currentConfig.items = itemsData;
      const output = `const MASTER_CONFIG = ${JSON.stringify(currentConfig, null, 2)};`;

      navigator.clipboard.writeText(output).then(() => {
        alert("✅ 成功複製最新配置代碼！\n\n請至 GitHub index.html 替換『const MASTER_CONFIG = ...』區域並 Commit changes 即可永久儲存。");
      }).catch(() => {
        prompt("請手動複製代碼並貼回 index.html：", output);
      });
    }

    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        document.body.classList.remove('admin-mode');
        document.getElementById('authBtn').innerText = "🔒 管理員登入";
        alert("已退出管理員模式");
      } else {
        const input = prompt("請輸入管理員密碼：");
        if (input === ADMIN_PASSWORD) {
          isAdmin = true;
          document.body.classList.add('admin-mode');
          document.getElementById('authBtn').innerText = "🔓 退出管理";
          alert("登入成功！編輯完成後記得點擊『💾 匯出設定』永久儲存。");
        } else if (input !== null) {
          alert("密碼錯誤！");
        }
      }
      renderDesktop();
      renderPlaylistUI();
      if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
    }

    function renderDesktop() {
      const container = document.getElementById('desktopContainer');
      container.querySelectorAll('.dynamic-item').forEach(i => i.remove());

      itemsData.filter(item => !item.parentId).forEach(item => {
        const el = createIconElement(item);
        container.appendChild(el);
      });
    }

    function createIconElement(item) {
      const div = document.createElement('div');
      div.className = 'icon-wrapper dynamic-item';
      div.draggable = isAdmin;

      const displayIcon = (item.type === 'image' && item.mediaUrl) ? item.mediaUrl : item.icon;

      div.innerHTML = `
        <div class="icon-tools">
          <button onclick="event.stopPropagation(); editItem('${item.id}')">✏️</button>
          <button onclick="event.stopPropagation(); deleteItem('${item.id}')">❌</button>
        </div>
        <img src="${displayIcon}" alt="icon" onerror="this.src='https://win98icons.alexmeub.com/icons/png/file_lines-0.png'">
        <span>${item.name}</span>
      `;

      div.onclick = () => handleItemClick(item);

      div.ondragstart = (e) => {
        if (!isAdmin) return;
        e.dataTransfer.setData('text/plain', item.id);
      };

      if (item.type === 'folder') {
        div.ondragover = (e) => { e.preventDefault(); div.classList.add('drag-hover'); };
        div.ondragleave = () => div.classList.remove('drag-hover');
        div.ondrop = (e) => {
          e.preventDefault();
          div.classList.remove('drag-hover');
          const draggedId = e.dataTransfer.getData('text/plain');
          if (draggedId && draggedId !== item.id) {
            const target = itemsData.find(i => i.id === draggedId);
            if (target) {
              target.parentId = item.id;
              saveState();
              alert(`已將「${target.name}」移入資料夾「${item.name}」！`);
            }
          }
        };
      }
      return div;
    }

    function handleItemClick(item) {
      if (item.type === 'folder') {
        openFolder(item.id, item.name);
      } else if (item.type === 'image') {
        openPhotoViewer(item.name, item.mediaUrl);
      } else if (item.type === 'video') {
        openVideoViewer(item.name, item.mediaUrl);
      } else if (item.type === 'note') {
        alert(`【${item.name}】\n\n${item.content}`);
      } else if (item.type === 'link') {
        document.getElementById('linkTitle').innerText = `🔗 ${item.name}`;
        document.getElementById('linkText').innerText = `即將前往：${item.url}`;
        document.getElementById('linkBtn').href = item.url;
        openWindow('link-win');
      }
    }

    function openPhotoViewer(title, url) {
      document.getElementById('photoViewerTitle').innerText = `🖼️ 檢視圖片：${title}`;
      document.getElementById('largePhotoDisplay').src = url;
      openWindow('photo-viewer-win');
    }

    function openVideoViewer(title, url) {
      document.getElementById('videoViewerTitle').innerText = `🎬 播放影片：${title}`;
      const v = document.getElementById('nativeVideoPlayer');
      v.src = url;
      openWindow('video-player-win');
      v.play().catch(()=>{});
    }

    function closeVideoPlayer() {
      const v = document.getElementById('nativeVideoPlayer');
      v.pause();
      v.src = "";
      closeWindow('video-player-win');
    }

    function openFolder(folderId, folderName) {
      currentOpenFolderId = folderId;
      document.getElementById('folderTitle').innerText = `📁 ${folderName}`;
      renderFolderContent(folderId);
      openWindow('folder-win');
    }

    function renderFolderContent(folderId) {
      const box = document.getElementById('folderInnerContent');
      box.innerHTML = '';
      const children = itemsData.filter(i => i.parentId === folderId);

      if (children.length === 0) {
        box.innerHTML = '<span style="font-size:12px; color:#888; padding:10px;">資料夾為空</span>';
        return;
      }

      children.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.style.cssText = 'display:flex; flex-direction:column; align-items:center; width:70px; cursor:pointer; text-align:center;';
        const displayIcon = (item.type === 'image' && item.mediaUrl) ? item.mediaUrl : item.icon;
        itemEl.innerHTML = `
          <img src="${displayIcon}" style="width:38px; height:38px; object-fit:cover; border-radius:3px;">
          <span style="font-size:11px; margin-top:3px; word-break:break-all;">${item.name}</span>
          ${isAdmin ? `<button style="font-size:9px; margin-top:3px;" onclick="event.stopPropagation(); moveBackToDesktop('${item.id}')">移至桌面</button>` : ''}
        `;
        itemEl.onclick = () => handleItemClick(item);
        box.appendChild(itemEl);
      });
    }

    function moveBackToDesktop(id) {
      const it = itemsData.find(i => i.id === id);
      if (it) {
        it.parentId = null;
        saveState();
      }
    }

    function createItem(type) {
      addItemToParent(type, null);
    }
    function createItemInsideCurrentFolder() {
      if (!currentOpenFolderId) return;
      const type = prompt("請輸入新增類型：folder (資料夾)、image (圖片)、video (影片)、note (便利貼) 或 link (外部連結)：", "image");
      if (['folder', 'image', 'video', 'note', 'link'].includes(type)) {
        addItemToParent(type, currentOpenFolderId);
      }
    }

    function addItemToParent(type, parentId) {
      const name = prompt("請輸入名稱：", type === 'video' ? "新影片" : "新項目");
      if (!name) return;
      let icon = "", content = "", url = "", mediaUrl = "";

      if (type === 'image') {
        const rawUrl = prompt("請貼上圖片網址（支援 Google 雲端共享連結或一般圖床）：");
        if (!rawUrl) return;
        mediaUrl = autoConvertDriveUrl(rawUrl, 'image');
        icon = mediaUrl;
      } else if (type === 'video') {
        const rawUrl = prompt("請貼上 MP4/M4A 影片網址（支援 Google 雲端共享連結）：");
        if (!rawUrl) return;
        mediaUrl = autoConvertDriveUrl(rawUrl, 'video');
        icon = "https://win98icons.alexmeub.com/icons/png/video_player_cool-0.png";
      } else if (type === 'note') {
        content = prompt("請輸入便利貼內文：", "寫下備忘...");
        const rawIcon = prompt("圖示網址 (留空預設)：", "");
        icon = rawIcon ? autoConvertDriveUrl(rawIcon, 'icon') : "https://win98icons.alexmeub.com/icons/png/notepad-5.png";
      } else if (type === 'link') {
        url = prompt("請輸入完整網址 (含 https://)：", "https://");
        const rawIcon = prompt("圖示網址 (留空預設)：", "");
        icon = rawIcon ? autoConvertDriveUrl(rawIcon, 'icon') : "https://win98icons.alexmeub.com/icons/png/html-2.png";
      } else if (type === 'folder') {
        const rawIcon = prompt("圖示網址 (留空預設)：", "");
        icon = rawIcon ? autoConvertDriveUrl(rawIcon, 'icon') : "https://win98icons.alexmeub.com/icons/png/directory_closed-4.png";
      }

      itemsData.push({ id: Date.now().toString(), parentId, type, name, icon, content, url, mediaUrl });
      saveState();
    }

    function editItem(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;
      const newName = prompt("重新命名：", item.name);
      if (newName) item.name = newName;

      if (item.type === 'image' || item.type === 'video') {
        const rawMedia = prompt("更換媒體網址：", item.mediaUrl);
        if (rawMedia) {
          item.mediaUrl = autoConvertDriveUrl(rawMedia, item.type);
          if (item.type === 'image') item.icon = item.mediaUrl;
        }
      } else {
        const rawIcon = prompt("更改圖示網址 (PNG/JPG)：", item.icon);
        if (rawIcon) item.icon = autoConvertDriveUrl(rawIcon, 'icon');
      }

      if (item.type === 'note') {
        const c = prompt("編輯便利貼內容：", item.content);
        if (c !== null) item.content = c;
      }
      if (item.type === 'link') {
        const u = prompt("更改連結網址：", item.url);
        if (u) item.url = u;
      }
      saveState();
    }

    function deleteItem(id) {
      if (confirm("確定刪除此項目嗎？")) {
        itemsData = itemsData.filter(i => i.id !== id && i.parentId !== id);
        saveState();
      }
    }

    function renderPlaylistUI() {
      const listEl = document.getElementById('playlistItems');
      listEl.innerHTML = '';
      playlist.forEach((track, idx) => {
        const li = document.createElement('li');
        li.className = idx === currentTrackIdx ? 'active' : '';
        li.innerHTML = `
          <span>${idx + 1}. ${track.title}</span>
          ${isAdmin ? `<button onclick="event.stopPropagation(); removeMusicTrack(${idx})">✕</button>` : ''}
        `;
        li.onclick = () => playTrack(idx);
        listEl.appendChild(li);
      });

      if (playlist.length > 0) {
        const current = playlist[currentTrackIdx];
        const ytIframe = document.getElementById('ytPlayer');
        const audioTag = document.getElementById('audioPlayer');

        document.getElementById('nowPlayingTitle').innerText = `🎵 播放中：${current.title}`;

        if (current.type === 'audio') {
          ytIframe.style.display = 'none';
          audioTag.style.display = 'block';
          audioTag.src = current.src;
          audioTag.play().catch(()=>{});
        } else {
          audioTag.style.display = 'none';
          audioTag.pause();
          ytIframe.style.display = 'block';
          ytIframe.src = `https://www.youtube.com/embed/${current.src}?autoplay=1`;
        }
      }
    }

    function playTrack(idx) {
      currentTrackIdx = idx;
      renderPlaylistUI();
    }

    function addMusicTrack() {
      const title = prompt("請輸入歌曲名稱：", "New Song");
      if (!title) return;
      const link = prompt("請輸入 YouTube 影片連結 或 直連 MP3/M4A 音訊網址（支援 Google 雲端共享連結）：");
      if (!link) return;

      let type = "youtube", src = link.trim();
      if (link.includes("drive.google.com") || link.endsWith(".mp3") || link.endsWith(".m4a") || link.includes("export=download")) {
        type = "audio";
        src = autoConvertDriveUrl(link, 'audio');
      } else {
        if (link.includes("v=")) src = link.split("v=")[1].substring(0, 11);
        else if (link.includes("youtu.be/")) src = link.split("youtu.be/")[1].substring(0, 11);
      }

      playlist.push({ title, src, type });
      saveState();
      renderPlaylistUI();
    }

    function removeMusicTrack(idx) {
      if (confirm("刪除這首歌曲？")) {
        playlist.splice(idx, 1);
        if (currentTrackIdx >= playlist.length) currentTrackIdx = 0;
        saveState();
        renderPlaylistUI();
      }
    }

    function toggleMaximize(id) {
      document.getElementById(id).classList.toggle('maximized');
    }

    let highestZ = 20;
    function openWindow(id) {
      const win = document.getElementById(id);
      win.style.display = 'block';
      win.style.zIndex = ++highestZ;
    }
    function closeWindow(id) {
      document.getElementById(id).style.display = 'none';
    }
    function dragElement(elmnt, event) {
      if (elmnt.classList.contains('maximized')) return;
      elmnt.style.zIndex = ++highestZ;
      let pos1 = 0, pos2 = 0, pos3 = event.clientX, pos4 = event.clientY;
      document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
      document.onmousemove = (e) => {
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      };
    }

    function changeWallpaper() {
      const rawUrl = prompt("請輸入桌布圖片網址（支援 Google 雲端共享連結）：", "");
      if (rawUrl) {
        const finalUrl = autoConvertDriveUrl(rawUrl, 'wallpaper');
        document.body.style.backgroundImage = `url('${finalUrl}')`;
        currentConfig.wallpaper = finalUrl;
        saveState();
      }
    }

    if (currentConfig.wallpaper) {
      document.body.style.backgroundImage = `url('${currentConfig.wallpaper}')`;
    }
    renderDesktop();
    renderPlaylistUI();
  </script>
</body>
</html>
