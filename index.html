<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro USB Desktop</title>
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
      background: #008080 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600') no-repeat center center;
      background-size: cover;
    }
    .top-actions {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 6px;
      z-index: 1000;
      flex-wrap: wrap;
    }
    /* 桌面圖示排列區 */
    .desktop {
      position: absolute;
      top: 55px; left: 15px; right: 15px; bottom: 40px;
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 16px;
    }
    .icon-wrapper {
      position: relative;
      width: 76px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-align: center;
      color: white;
      text-shadow: 1px 1px 2px black;
    }
    .icon-wrapper img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      pointer-events: none;
    }
    .icon-wrapper span {
      font-size: 11px;
      padding: 2px 3px;
      margin-top: 4px;
      word-break: break-all;
    }
    .icon-tools {
      display: none;
      position: absolute;
      top: -8px;
      right: -4px;
      gap: 2px;
    }
    /* 只有管理員啟用時滑過圖示才會顯示編輯/刪除 */
    body.admin-mode .icon-wrapper:hover .icon-tools {
      display: flex;
    }
    .icon-tools button {
      font-size: 9px;
      padding: 1px 3px;
      cursor: pointer;
    }
    .admin-only {
      display: none;
    }
    body.admin-mode .admin-only {
      display: inline-block;
    }
    .win-modal {
      position: absolute;
      display: none;
      z-index: 10;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.4);
    }
    .taskbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 35px;
      background: #c0c0c0;
      border-top: 2px solid #fff;
      display: flex;
      align-items: center;
      padding: 2px 6px;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- 工具列 -->
  <div class="top-actions">
    <!-- 管理員切換按鈕 -->
    <button id="authBtn" onclick="toggleAdmin()">🔒 管理員登入</button>
    
    <!-- 僅管理員可見的編輯功能 -->
    <button class="admin-only" onclick="createFolder()">+ 資料夾</button>
    <button class="admin-only" onclick="createNote()">+ 便利貼</button>
    <button class="admin-only" onclick="createLink()">+ 外部連結</button>
    <button class="admin-only" onclick="changeMusic()">🎵 換音樂</button>
    <button class="admin-only" onclick="changeWallpaper()">🎨 換背景</button>
  </div>

  <!-- 桌面容器 -->
  <div class="desktop" id="desktopContainer">
    <!-- 預設音樂視窗圖示 -->
    <div class="icon-wrapper" onclick="openWindow('music-win')">
      <img src="https://win98icons.alexmeub.com/icons/png/cd_audio_cd_a-4.png" alt="music">
      <span>Playlist</span>
    </div>
  </div>

  <!-- 資料夾檢視視窗 -->
  <div id="folder-win" class="window win-modal" style="top: 80px; left: 80px; width: 360px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="folderTitle">📁 資料夾</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeWindow('folder-win')"></button>
      </div>
    </div>
    <div class="window-body">
      <div id="folderInnerContent" style="display:flex; gap:12px; flex-wrap:wrap; min-height:80px; padding:10px;"></div>
    </div>
  </div>

  <!-- YouTube 音樂播放視窗 -->
  <div id="music-win" class="window win-modal" style="top: 100px; left: 120px; width: 360px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text">🎵 Now Playing</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeWindow('music-win')"></button>
      </div>
    </div>
    <div class="window-body">
      <iframe id="ytPlayer" width="100%" height="200" src="https://www.youtube.com/embed/kzdJkT4kp-A" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- 外部連結跳轉確認視窗 -->
  <div id="link-win" class="window win-modal" style="top: 120px; left: 160px; width: 300px;">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)">
      <div class="title-bar-text" id="linkTitle">🔗 外部連結</div>
      <div class="title-bar-controls">
        <button aria-label="Close" onclick="closeWindow('link-win')"></button>
      </div>
    </div>
    <div class="window-body" style="text-align:center;">
      <p id="linkText" style="margin-bottom:12px; font-size:12px;"></p>
      <a id="linkBtn" href="#" target="_blank" style="text-decoration:none;">
        <button style="width:100%; padding:6px;">前往網站 (Visit Site)</button>
      </a>
    </div>
  </div>

  <!-- 底部工作列 -->
  <div class="taskbar">
    <button style="font-weight:bold; display:flex; align-items:center; gap:4px;">
      <img src="https://win98icons.alexmeub.com/icons/png/windows-0.png" width="16" height="16"> Start
    </button>
  </div>

  <script>
    // 預設管理員密碼（可在程式碼內自行更改）
    const ADMIN_PASSWORD = "admin";
    let isAdmin = false;

    // 初始資料物件
    const defaultItems = [
      { id: "1", type: "folder", name: "WINTER", icon: "https://win98icons.alexmeub.com/icons/png/directory_open_file_mydocs-4.png" },
      { id: "2", type: "note", name: "生咖應援清單", icon: "https://win98icons.alexmeub.com/icons/png/notepad-5.png", content: "1. 應援物清點\n2. 易拉架佈置確認" },
      { id: "3", type: "link", name: "預約表單", icon: "https://win98icons.alexmeub.com/icons/png/html-2.png", url: "https://google.com" }
    ];

    let itemsData = JSON.parse(localStorage.getItem('desktop_items')) || defaultItems;

    // 權限切換
    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        document.body.classList.remove('admin-mode');
        document.getElementById('authBtn').innerText = "🔒 管理員登入";
        alert("已退出編輯模式！");
      } else {
        const input = prompt("請輸入管理員密碼：");
        if (input === ADMIN_PASSWORD) {
          isAdmin = true;
          document.body.classList.add('admin-mode');
          document.getElementById('authBtn').innerText = "🔓 退出管理";
          alert("登入成功！已解鎖編輯、新增與刪除功能。");
        } else if (input !== null) {
          alert("密碼錯誤！");
        }
      }
      renderDesktop();
    }

    // 渲染桌面
    function renderDesktop() {
      const container = document.getElementById('desktopContainer');
      const dynamicIcons = container.querySelectorAll('.dynamic-item');
      dynamicIcons.forEach(i => i.remove());

      itemsData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'icon-wrapper dynamic-item';
        div.innerHTML = `
          <div class="icon-tools">
            <button onclick="event.stopPropagation(); editItem('${item.id}')">✏️</button>
            <button onclick="event.stopPropagation(); deleteItem('${item.id}')">❌</button>
          </div>
          <img src="${item.icon}" alt="icon" onerror="this.src='https://win98icons.alexmeub.com/icons/png/file_lines-0.png'">
          <span>${item.name}</span>
        `;
        div.onclick = () => handleItemClick(item);
        container.appendChild(div);
      });
    }

    function handleItemClick(item) {
      if (item.type === 'folder') {
        document.getElementById('folderTitle').innerText = `📁 ${item.name}`;
        openWindow('folder-win');
      } else if (item.type === 'note') {
        alert(`【${item.name}】\n\n${item.content}`);
      } else if (item.type === 'link') {
        document.getElementById('linkTitle').innerText = `🔗 ${item.name}`;
        document.getElementById('linkText').innerText = `即將前往：${item.url}`;
        document.getElementById('linkBtn').href = item.url;
        openWindow('link-win');
      }
    }

    function saveAndRefresh() {
      localStorage.setItem('desktop_items', JSON.stringify(itemsData));
      renderDesktop();
    }

    // 新增資料夾
    function createFolder() {
      const name = prompt("資料夾名稱：", "New Folder");
      if (!name) return;
      const icon = prompt("圖示網址 (PNG/JPG，留空則使用預設)：", "https://win98icons.alexmeub.com/icons/png/directory_closed-4.png");
      itemsData.push({ id: Date.now().toString(), type: 'folder', name, icon: icon || "https://win98icons.alexmeub.com/icons/png/directory_closed-4.png" });
      saveAndRefresh();
    }

    // 新增便利貼
    function createNote() {
      const name = prompt("便利貼名稱：", "備忘錄");
      if (!name) return;
      const content = prompt("請輸入便利貼內文：", "寫下備忘內容...");
      const icon = prompt("圖示網址 (PNG/JPG，留空預設)：", "https://win98icons.alexmeub.com/icons/png/notepad-5.png");
      itemsData.push({ id: Date.now().toString(), type: 'note', name, content, icon: icon || "https://win98icons.alexmeub.com/icons/png/notepad-5.png" });
      saveAndRefresh();
    }

    // 新增外部連結
    function createLink() {
      const name = prompt("連結名稱：", "Google 表單");
      if (!name) return;
      const url = prompt("請輸入完整網址 (含 https://)：", "https://");
      if (!url) return;
      const icon = prompt("圖示網址 (PNG/JPG，留空預設)：", "https://win98icons.alexmeub.com/icons/png/html-2.png");
      itemsData.push({ id: Date.now().toString(), type: 'link', name, url, icon: icon || "https://win98icons.alexmeub.com/icons/png/html-2.png" });
      saveAndRefresh();
    }

    // 編輯項目
    function editItem(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;

      const newName = prompt("重新命名：", item.name);
      if (newName) item.name = newName;

      const newIcon = prompt("更改圖示網址 (PNG/JPG)：", item.icon);
      if (newIcon) item.icon = newIcon;

      if (item.type === 'note') {
        const newContent = prompt("更改便利貼內文：", item.content);
        if (newContent !== null) item.content = newContent;
      } else if (item.type === 'link') {
        const newUrl = prompt("更改目標網址：", item.url);
        if (newUrl) item.url = newUrl;
      }
      saveAndRefresh();
    }

    // 刪除項目
    function deleteItem(id) {
      if (confirm("確定要刪除嗎？")) {
        itemsData = itemsData.filter(i => i.id !== id);
        saveAndRefresh();
      }
    }

    // 更換音樂
    function changeMusic() {
      const vid = prompt("請輸入 YouTube 影片網址或 11 碼 Video ID：", "kzdJkT4kp-A");
      if (vid) {
        let cleanId = vid;
        if (vid.includes("v=")) cleanId = vid.split("v=")[1].substring(0, 11);
        else if (vid.includes("youtu.be/")) cleanId = vid.split("youtu.be/")[1].substring(0, 11);
        document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${cleanId}`;
        localStorage.setItem('desktop_music', cleanId);
      }
    }

    // 更換桌布
    function changeWallpaper() {
      const url = prompt("請輸入桌布圖片網址 (PNG/JPG)：", "");
      if (url) {
        document.body.style.backgroundImage = `url('${url}')`;
        localStorage.setItem('desktop_wallpaper', url);
      }
    }

    // 視窗拖曳與層級控制
    let highestZ = 20;
    function openWindow(id) {
      const win = document.getElementById(id);
      win.style.display = 'block';
      win.style.zIndex = ++highestZ;
    }
    function closeWindow(id) {
      document.getElementById(id).style.display = 'none';
    }
    function dragElement(elmnt, event) {
      elmnt.style.zIndex = ++highestZ;
      let pos1 = 0, pos2 = 0, pos3 = event.clientX, pos4 = event.clientY;
      document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
      document.onmousemove = (e) => {
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      };
    }

    // 初始化讀取配置
    const savedBg = localStorage.getItem('desktop_wallpaper');
    if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;
    const savedMusic = localStorage.getItem('desktop_music');
    if (savedMusic) document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${savedMusic}`;

    renderDesktop();
  </script>
</body>
</html>
