<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2027 WINTER Bday desktop</title>

  <!-- 網址分享縮圖 -->
  <meta property="og:title" content="2027 WINTER Bday desktop">
  <meta property="og:description" content="A special retro desktop space created for WINTER">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g">

  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    /* 黃色星星滑鼠游標 */
    :root {
      --star-cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><polygon points='12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9' fill='%23FFD700' stroke='%23B8860B' stroke-width='1.5'/></svg>") 4 4, auto;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
      background: #008080 url('https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g') no-repeat center center;
      background-size: cover;
    }
    
    .icon-wrapper, .top-actions button, .folder-nav-bar button, .start-menu li, .taskbar button, a, .title-bar-controls button {
      cursor: var(--star-cursor) !important;
    }

    /* 頂部操作工具列：設定較低層級，且不阻擋空白區點擊 */
    .top-actions {
      position: absolute;
      top: 6px; left: 6px; right: 6px;
      display: flex; gap: 4px;
      z-index: 50; flex-wrap: nowrap;
      overflow-x: auto; padding-bottom: 4px;
      pointer-events: none;
    }
    .top-actions button, .top-actions span {
      flex-shrink: 0; font-size: 11px; padding: 2px 6px; cursor: pointer;
      pointer-events: auto;
    }

    /* 桌面容器 */
    .desktop {
      position: absolute;
      top: 45px; left: 0; right: 0; bottom: 35px;
      overflow: hidden;
    }

    /* 圖示結構 */
    .icon-wrapper {
      position: absolute;
      width: 76px;
      display: flex; flex-direction: column; align-items: center;
      cursor: var(--star-cursor); text-align: center;
      color: white; text-shadow: 1px 1px 2px black;
      padding: 3px;
      border-radius: 2px;
      touch-action: none;
    }
    .icon-wrapper.selected {
      background: rgba(0, 0, 128, 0.45);
      outline: 1px dotted #ffff00;
    }
    .icon-wrapper.selected span {
      background: #000080; color: #fff;
    }
    .icon-wrapper.cut-mode {
      opacity: 0.45; filter: grayscale(80%);
    }

    .icon-select-check {
      display: none;
      position: absolute;
      top: -2px; left: 2px;
      width: 14px; height: 14px;
      cursor: var(--star-cursor);
      z-index: 20;
    }
    body.admin-mode .icon-select-check {
      display: block;
    }

    /* 雙模式封面框 (專輯與資料夾通用) */
    .icon-art-box {
      position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    }
    .icon-art-box .base-img {
      width: 42px; height: 42px; object-fit: contain; pointer-events: none;
    }
    .icon-art-box .custom-cover-badge {
      position: absolute; width: 22px; height: 22px; object-fit: cover; border: 1px solid #fff; border-radius: 2px;
      bottom: 0; right: 0; box-shadow: 1px 1px 3px rgba(0,0,0,0.6); pointer-events: none;
    }

    .icon-wrapper span {
      font-size: 11px; padding: 1px 3px; margin-top: 3px; word-break: break-all; pointer-events: none;
    }

    .admin-only { display: none !important; }
    body.admin-mode .admin-only { display: inline-flex !important; }

    /* 視窗樣式：確保右上角按鈕永遠可點擊 */
    .win-modal {
      position: fixed; display: none; z-index: 100;
      box-shadow: 2px 2px 14px rgba(0,0,0,0.6);
      width: 94vw; max-width: 580px;
      min-width: 260px; min-height: 180px;
      resize: both; overflow: hidden;
    }
    .win-modal .title-bar {
      cursor: move;
      position: relative;
    }
    .win-modal .title-bar-controls {
      position: relative;
      z-index: 100;
      display: flex; gap: 2px;
    }
    .win-modal .title-bar-controls button {
      cursor: var(--star-cursor) !important;
      pointer-events: auto !important;
    }

    .win-modal .window-body {
      height: calc(100% - 32px);
      max-height: calc(100% - 32px);
      overflow-y: auto; padding: 6px;
    }

    /* 最大化樣式：高於頂部操作列，置頂無阻礙 */
    .win-modal.maximized {
      top: 0 !important; left: 0 !important; transform: none !important;
      width: 100vw !important; max-width: 100vw !important; height: calc(100vh - 35px) !important;
      z-index: 1500 !important;
      resize: none !important;
    }
    .win-modal.maximized .window-body {
      height: calc(100vh - 68px) !important;
      max-height: calc(100vh - 68px) !important;
    }

    /* 資料夾導航列樣式 */
    .folder-nav-bar {
      display: flex; gap: 4px; align-items: center; margin-bottom: 6px; background: #dfdfdf;
      padding: 3px 5px; border: 1px solid #7f9db9; flex-wrap: wrap;
    }
    .folder-nav-bar button {
      font-size: 11px; padding: 2px 5px; height: 22px; cursor: pointer;
    }

    .media-container {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #000; display: flex; align-items: center; justify-content: center;
    }
    .media-container iframe, .media-container video {
      width: 100%; height: 100%; border: none;
    }
    .photo-stage {
      width: 100%; min-height: 220px; max-height: 60vh;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a1a; overflow: hidden; padding: 6px;
    }
    .photo-stage img {
      max-width: 100%; max-height: 55vh; object-fit: contain; border: 1px solid #fff;
    }

    /* 底部工作列：層級提升為 2500，始終置頂 */
    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 35px;
      background: #c0c0c0; border-top: 2px solid #fff;
      display: flex; align-items: center; justify-content: space-between; padding: 2px 6px; z-index: 2500;
    }
    .taskbar-left {
      display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1;
    }
    .task-item-btn {
      font-size: 11px; padding: 2px 6px; height: 26px; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
    }
    .taskbar-right {
      font-size: 11px; display: flex; align-items: center; padding-left: 8px; flex-shrink: 0;
    }
    .taskbar-right a {
      color: #000; text-decoration: none; font-weight: bold; border-bottom: 1px dotted #555;
    }

    /* WINTER01 XP 開始選單 */
    .start-menu {
      position: fixed;
      bottom: 35px; left: 4px;
      width: 230px; max-width: 85vw;
      background: #c0c0c0; border: 2px outset #fff;
      box-shadow: 3px 3px 12px rgba(0,0,0,0.5);
      display: none; z-index: 3000; padding: 3px;
    }
    .start-menu-banner {
      background: linear-gradient(180deg, #104e8b, #1e90ff);
      color: #fff; font-weight: bold;
      padding: 8px 10px; font-size: 13px; margin-bottom: 4px;
      letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between;
    }
    .start-menu ul { list-style: none; margin: 0; padding: 0; }
    .start-menu li {
      padding: 7px 10px; font-size: 12px; cursor: var(--star-cursor);
      display: flex; align-items: center; gap: 8px;
    }
    .start-menu li:hover { background: #000080; color: #fff; }

    .playlist-box {
      list-style: none; margin: 8px 0 0 0; padding: 0;
      background: #fff; border: 2px inset #dfdfdf; height: 130px; overflow-y: auto;
    }
    .playlist-box li {
      padding: 5px 8px; font-size: 12px; cursor: var(--star-cursor); display: flex; justify-content: space-between; align-items: center;
    }
    .playlist-box li:hover { background: #000080; color: #fff; }
    .playlist-box li.active { background: #000080; color: #fff; font-weight: bold; }
  </style>
</head>
<body onclick="handleGlobalClick(event)">

  <!-- 頂部管理工具列 -->
  <div class="top-actions">
    <button id="authBtn" onclick="toggleAdmin(event)">🔒 管理員</button>

      <button onclick="editSelectedItem(event)">✏️ 編輯</button>

    <button class="admin-only" onclick="changeWallpaper(event)">🎨 桌布</button>
    <button class="admin-only" onclick="openStartMenuConfigModal(event)">⭐ 設定開始選單</button>
    <button class="admin-only" style="background:#000080; color:#fff; font-weight:bold;" onclick="exportCurrentState(event)">💾 永久儲存</button>

    <hr style="margin: 4px 0;">

  </div>

  <!-- 移動到... 目標資料夾選擇彈窗 -->

    </div>
    <div class="window-body">
      <p style="font-size:12px; margin-top:0;">請點選要移動進去的位置：</p>

    </div>
  </div>

  <!-- 開始選單自訂彈窗 -->

      <div class="title-bar-text">⭐ 自訂開始選單項目</div>

    </div>

  <!-- 外部連結視窗 -->

    function extractDriveId(url) {
      if (!url) return null;
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function autoFormatMediaUrl(url, type) {
      if (!url) return url;
      const driveId = extractDriveId(url);
      if (driveId) {
        if (type === 'image' || type === 'icon' || type === 'wallpaper') return `https://lh3.googleusercontent.com/d/${driveId}`;
        return `https://drive.google.com/file/d/${driveId}/preview`;
      }
      return url.trim();
    }

    function pasteItem(targetParentId, e) {

        alert("剪貼簿目前沒有項目！請先選取項目並點擊「複製」或「剪下」。");
        return;
      }
      if (isCutOperation) {
        if (clipboardItem.id === targetParentId) { alert("無法將項目移入自己內部！"); return; }
        clipboardItem.parentId = targetParentId;
        if (!targetParentId) clipboardItem.pos = { x: 120, y: 120 };
        clipboardItem = null;
        isCutOperation = false;
      } else {
        function cloneRecursive(origItem, pId) {
          const newId = "copy_" + Date.now() + "_" + Math.floor(Math.random()*1000);
          const cloned = { ...origItem, id: newId, parentId: pId, name: origItem.name + " (副本)" };
          if (cloned.pos) cloned.pos = { x: cloned.pos.x + 24, y: cloned.pos.y + 24 };
          itemsData.push(cloned);
          const children = itemsData.filter(i => i.parentId === origItem.id);
          children.forEach(ch => cloneRecursive(ch, newId));
        }
        cloneRecursive(clipboardItem, targetParentId);
      }
      selectedItemId = null;
      saveState();
    }

    function createIconElement(item) {
      const div = document.createElement('div');
      const isSelected = selectedItemId === item.id;
      const isCut = clipboardItem && clipboardItem.id === item.id && isCutOperation;
      div.className = `icon-wrapper dynamic-item ${isSelected ? 'selected' : ''} ${isCut ? 'cut-mode' : ''}`;

      let iconHtml = "";
      if (item.type === 'album') {
        if (item.coverBadge) {
          iconHtml = `

        }
      } else if (item.type === 'folder') {
        if (item.coverBadge) {
          iconHtml = `

              <img src="${ICON_FOLDER_DEFAULT}" class="base-img">
              <img src="${item.coverBadge}" class="custom-cover-badge" onerror="this.style.display='none'">

          iconHtml = `<div class="icon-art-box"><img src="${ICON_FOLDER_DEFAULT}" class="base-img"></div>`;
        }
      } else {
        const displayIcon = (item.type === 'image' && item.mediaUrl) ? item.mediaUrl : (item.icon || ICON_FOLDER_DEFAULT);
        iconHtml = `<img src="${displayIcon}" style="width:42px; height:42px; object-fit:contain;" onerror="this.src='${ICON_FOLDER_DEFAULT}'">`;
      }

      const checkHtml = `<input type="checkbox" class="icon-select-check" ${isSelected ? 'checked' : ''} onclick="selectItem('${item.id}', event)">`;
      div.innerHTML = `${checkHtml}${iconHtml}<span>${item.name}</span>`;
      return div;
    }

    function bindDragAndClick(el, item) {
      let isDragging = false;
      let startX = 0, startY = 0, origX = 0, origY = 0;
      let hasMoved = false;

      function onPointerDown(e) {
        if (e.target.classList.contains('icon-select-check')) return;
        if (e.button && e.button !== 0) return;

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX;
        startY = clientY;
        origX = item.pos ? item.pos.x : parseInt(el.style.left) || 16;
        origY = item.pos ? item.pos.y : parseInt(el.style.top) || 16;
        hasMoved = false;

        if (isAdmin) isDragging = true;

        function onPointerMove(moveEvent) {
          const moveX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
          const moveY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
          const dx = moveX - startX;
          const dy = moveY - startY;

          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            hasMoved = true;
            if (isDragging && isAdmin) {
              el.style.left = (origX + dx) + "px";
              el.style.top = (origY + dy) + "px";
            }
          }
        }

        function onPointerUp(upEvent) {
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('mouseup', onPointerUp);
          window.removeEventListener('touchmove', onPointerMove);
          window.removeEventListener('touchend', onPointerUp);

          if (isDragging && hasMoved) {
            item.pos = { x: parseInt(el.style.left), y: parseInt(el.style.top) };
            saveState();
          } else if (!hasMoved) {
            if (isAdmin) {
              selectedItemId = item.id;
              updateSelectionUI();
              renderDesktop();
              if (currentOpenFolderId) renderFolderContent(currentOpenFolderId);
            }
            handleItemClick(item);
          }
          isDragging = false;
        }

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);
      }

      el.addEventListener('mousedown', onPointerDown);
      el.addEventListener('touchstart', onPointerDown, { passive: true });
    }

    function addTrackToCurrentAlbum(e) {
      if (e) e.stopPropagation();
      const album = itemsData.find(i => i.id === currentOpenAlbumId);

      const driveId = extractDriveId(link);
      if (driveId) {
        src = `https://drive.google.com/file/d/${driveId}/preview`;
      } else if (link.includes("v=")) {
        src = link.split("v=")[1].substring(0, 11);
      } else if (link.includes("youtu.be/")) {
        src = link.split("youtu.be/")[1].substring(0, 11);
      }

      album.tracks.push({ title, src, type: driveId ? "drive" : "youtube" });
      saveState();
      renderAlbumTrackList();
    }

    function removeAlbumTrack(idx) {
      const album = itemsData.find(i => i.id === currentOpenAlbumId);
      if (!album) return;
      if (confirm("刪除這首歌曲？")) {
        album.tracks.splice(idx, 1);
        saveState();
        renderAlbumTrackList();
      }
    }

    /* ========== 視窗縮小（最小化至工作列）、最大化／還原、拖曳與關閉核心修復 ========== */
    let highestZ = 200;
    const minimizedWindows = {};

    function openWindow(id) {
      const win = document.getElementById(id);
      if (!win) return;
      win.style.display = 'block';
      win.style.zIndex = ++highestZ;

      if (!win.classList.contains('maximized') && !windowRestoreBounds[id]) {
        win.style.top = '50%';
        win.style.left = '50%';
        win.style.transform = 'translate(-50%, -50%)';
      }

      delete minimizedWindows[id];
      updateTaskbar();
    }
    
    function closeWindow(id, e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const win = document.getElementById(id);
      if (!win) return;
      win.style.display = 'none';
      win.classList.remove('maximized');
      
      delete windowRestoreBounds[id];

      if (id === 'folder-win') {
        currentOpenFolderId = null;
        folderHistory = [];
        folderForwardStack = [];
      }
      delete minimizedWindows[id];
      updateTaskbar();
    }
    
    function closeAlbumWindow(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const iframe = document.getElementById('albumIframe');
      if (iframe) iframe.src = '';
      closeWindow('album-win', e);
      currentOpenAlbumId = null;
    }

    function minimizeWindow(id, title, e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const win = document.getElementById(id);
      if (!win) return;
      win.style.display = 'none';
      minimizedWindows[id] = title;
      updateTaskbar();
    }

    function toggleMaximize(id, e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const win = document.getElementById(id);
      if (!win) return;

      if (win.classList.contains('maximized')) {
        // 還原為普通視窗
        win.classList.remove('maximized');
        const prev = windowRestoreBounds[id];
        if (prev) {
          win.style.top = prev.top;
          win.style.left = prev.left;
          win.style.width = prev.width;
          win.style.height = prev.height;
          win.style.transform = prev.transform || 'none';
        } else {
          win.style.top = '50%';
          win.style.left = '50%';
          win.style.transform = 'translate(-50%, -50%)';
          win.style.width = '94vw';
          win.style.maxWidth = '580px';
          win.style.height = 'auto';
        }
      } else {
        // 記錄放大前狀態
        windowRestoreBounds[id] = {
          top: win.style.top || '50%',
          left: win.style.left || '50%',
          width: win.style.width || '94vw',
          height: win.style.height || 'auto',
          transform: win.style.transform || 'translate(-50%, -50%)'
        };
        win.classList.add('maximized');
      }
    }

    function updateTaskbar() {
      const container = document.getElementById('taskbarItems');
      if (!container) return;
      container.innerHTML = '';
      for (const [winId, title] of Object.entries(minimizedWindows)) {
        const btn = document.createElement('button');
        btn.className = 'task-item-btn';
        btn.innerText = `📁 ${title}`;
        btn.onclick = (e) => {
          e.stopPropagation();
          openWindow(winId);
        };
        container.appendChild(btn);
      }
    }

    // 拖曳視窗：點擊右上角按鈕時嚴格退出，絕不阻斷按鈕事件
    function dragElement(elmnt, event) {
      if (event.target.closest('.title-bar-controls')) return;
      if (elmnt.classList.contains('maximized') || window.innerWidth < 600) return;

      elmnt.style.zIndex = ++highestZ;

      if (elmnt.style.transform && elmnt.style.transform.includes('translate')) {
        const rect = elmnt.getBoundingClientRect();
        elmnt.style.transform = 'none';
        elmnt.style.top = rect.top + 'px';
        elmnt.style.left = rect.left + 'px';
      }

      let pos1 = 0, pos2 = 0, pos3 = event.clientX, pos4 = event.clientY;
      document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
      document.onmousemove = (e) => {
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      };
    }

    // 資料夾歷史紀錄
    function openFolderWithHistory(folderId, folderName) {
      if (currentOpenFolderId && currentOpenFolderId !== folderId) {
        folderHistory.push({ id: currentOpenFolderId, name: document.getElementById('folderTitle').innerText.replace('📁 ', '') });
        folderForwardStack = [];
      }
      currentOpenFolderId = folderId;
      document.getElementById('folderTitle').innerText = `📁 ${folderName}`;
      renderFolderContent(folderId);
      updateNavButtons();
      openWindow('folder-win');
    }

    function navGoBack(e) {
      if (e) e.stopPropagation();
      if (folderHistory.length === 0) return;
      const prev = folderHistory.pop();
      folderForwardStack.push({ id: currentOpenFolderId, name: document.getElementById('folderTitle').innerText.replace('📁 ', '') });
      currentOpenFolderId = prev.id;
      document.getElementById('folderTitle').innerText = `📁 ${prev.name}`;
      renderFolderContent(prev.id);
      updateNavButtons();
    }

    function navGoForward(e) {
      if (e) e.stopPropagation();
      if (folderForwardStack.length === 0) return;
      const next = folderForwardStack.pop();
      folderHistory.push({ id: currentOpenFolderId, name: document.getElementById('folderTitle').innerText.replace('📁 ', '') });
      currentOpenFolderId = next.id;
      document.getElementById('folderTitle').innerText = `📁 ${next.name}`;
      renderFolderContent(next.id);
      updateNavButtons();
    }

    function updateNavButtons() {
      const backBtn = document.getElementById('btnNavBack');
      const fwdBtn = document.getElementById('btnNavForward');
      if (backBtn) backBtn.disabled = folderHistory.length === 0;
      if (fwdBtn) fwdBtn.disabled = folderForwardStack.length === 0;
    }

    function renderFolderContent(folderId) {
      const box = document.getElementById('folderInnerContent');
      box.innerHTML = '';
      const children = itemsData.filter(i => i.parentId === folderId);

      if (children.length === 0) {
        box.innerHTML = '<span style="font-size:12px; color:#888; padding:8px;">此資料夾為空</span>';
        return;
      }

      children.forEach(item => {
        const itemEl = createIconElement(item);
        itemEl.style.position = 'relative';
        itemEl.onclick = (e) => {
          e.stopPropagation();
          if (isAdmin) {
            selectedItemId = item.id;
            updateSelectionUI();
            renderFolderContent(folderId);
          }
          handleItemClick(item);
        };
        box.appendChild(itemEl);
      });
    }

    function createItem(type, parentId, e) {
      if (e) e.stopPropagation();
      addItem(type, parentId);
    }
    function createItemInsideFolder(type, e) {
      if (e) e.stopPropagation();
      if (!currentOpenFolderId) return;
      addItem(type, currentOpenFolderId);
    }

    function addItem(type, parentId) {
      const name = prompt("請輸入名稱：", "新項目");
      if (!name) return;
      let icon = "", content = "", url = "", mediaUrl = "";

      if (type === 'video') {
        const rawUrl = prompt("請貼上 YouTube 網址 或 Google 雲端影片共享連結：");
        if (!rawUrl) return;
        mediaUrl = autoFormatMediaUrl(rawUrl, 'video');
        icon = ICON_DISC_PURE;
      } else if (type === 'image') {
        const rawUrl = prompt("請貼上圖片網址（支援 Google 雲端共享連結）：");
        if (!rawUrl) return;
        mediaUrl = autoFormatMediaUrl(rawUrl, 'image');
        icon = mediaUrl;
      } else if (type === 'note') {
        content = prompt("請輸入便利貼內文：", "寫下備忘...");
        icon = "https://win98icons.alexmeub.com/icons/png/notepad-5.png";
      } else if (type === 'link') {
        url = prompt("請輸入完整跳轉網址 (含 https://)：", "https://");
        icon = W_FORM_ICON;
      }

      itemsData.push({ id: Date.now().toString(), parentId, type, name, icon, content, url, mediaUrl, pos: { x: 120, y: 120 } });
      saveState();
    }

    function editItem(id) {
      const item = itemsData.find(i => i.id === id);
      if (!item) return;

      const newName = prompt("重新命名：", item.name);
      if (newName) item.name = newName;

      if (item.type === 'album' || item.type === 'folder') {
        const rawBadge = prompt("更改封面縮圖網址 (支援 Google 雲端共享連結，留空則純圖示)：", item.coverBadge || "");
        if (rawBadge !== null) {
          item.coverBadge = rawBadge ? autoFormatMediaUrl(rawBadge, 'image') : "";
          item.iconType = item.coverBadge ? "cover" : "pure";
        }
      } else {
        const rawIcon = prompt("更改圖示網址 (留空不改)：", item.icon || "");
        if (rawIcon) item.icon = autoFormatMediaUrl(rawIcon, 'icon');
      }

      if (item.type === 'video') {
        const rawMedia = prompt("更改音樂／影片連結 (YouTube 或 Google雲端)：", item.mediaUrl);
        if (rawMedia) item.mediaUrl = autoFormatMediaUrl(rawMedia, 'video');
      } else if (item.type === 'image') {
        const rawMedia = prompt("更改圖片網址：", item.mediaUrl);
        if (rawMedia) {
          item.mediaUrl = autoFormatMediaUrl(rawMedia, 'image');
          item.icon = item.mediaUrl;
        }
      } else if (item.type === 'link') {
        const u = prompt("更改跳轉網址：", item.url);
        if (u) item.url = u;
      } else if (item.type === 'note') {
        const c = prompt("更改便利貼內文：", item.content);
        if (c !== null) item.content = c;
      }

      saveState();
    }

    function openPhotoViewer(title, url) {
      document.getElementById('photoViewerTitle').innerText = `🖼️ ${title}`;
      document.getElementById('largePhotoDisplay').src = url;
      openWindow('photo-viewer-win');
    }

    function openUniversalPlayer(title, url) {
      document.getElementById('mediaViewerTitle').innerText = `🎬 ${title}`;
      const iframe = document.getElementById('universalIframe');
      const video = document.getElementById('universalVideo');

      if (url.includes('drive.google.com') || url.includes('youtube.com') || url.includes('youtu.be')) {
        let finalSrc = url;
        if (url.includes('youtube.com') || url.includes('youtu.be')) {
          let vid = url;
          if (url.includes("v=")) vid = url.split("v=")[1].substring(0, 11);
          else if (url.includes("youtu.be/")) vid = url.split("youtu.be/")[1].substring(0, 11);
          finalSrc = `https://www.youtube-nocookie.com/embed/${vid}?autoplay=0&enablejsapi=1&rel=0`;
        }
        video.pause(); video.style.display = 'none';
        iframe.style.display = 'block';
        if (iframe.src !== finalSrc) iframe.src = finalSrc;
      } else {
        iframe.src = ''; iframe.style.display = 'none';
        video.style.display = 'block';
        video.src = url;
      }
      openWindow('media-player-win');
    }

    function closeUniversalPlayer(e) {
      if (e) e.stopPropagation();
      document.getElementById('universalIframe').src = '';
      const v = document.getElementById('universalVideo');
      v.pause(); v.src = '';
      closeWindow('media-player-win');
    }

    function changeWallpaper(e) {
      if (e) e.stopPropagation();
      const rawUrl = prompt("請輸入桌布圖片網址（支援 Google 雲端共享連結）：", "");
      if (rawUrl) {
        const finalUrl = autoFormatMediaUrl(rawUrl, 'wallpaper');
        document.body.style.backgroundImage = `url('${finalUrl}')`;
        currentConfig.wallpaper = finalUrl;
        saveState();
      }
    }

    if (currentConfig.wallpaper) {
      document.body.style.backgroundImage = `url('${currentConfig.wallpaper}')`;
    }
    renderDesktop();
    renderStartMenu();
  </script>
</body>
