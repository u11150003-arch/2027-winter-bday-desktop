<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2027 WINTER Bday desktop</title>

  <meta property="og:title" content="2027 WINTER Bday desktop">
  <meta property="og:description" content="A special retro desktop space created for WINTER">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g">

  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --star-cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><polygon points='12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9' fill='%23FFD700' stroke='%23B8860B' stroke-width='1.5'/></svg>") 4 4, auto;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --taskbar-h: calc(38px + var(--safe-bottom));
    }

    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #000 url('https://lh3.googleusercontent.com/d/1FxNNT9a2bBobCvFCBaI1ze3d7fVsPm9g') no-repeat center center;
      background-size: cover;
      font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
    }
    
    .icon-wrapper, .top-bar-wrapper button, .folder-nav-bar button, .start-menu li, .taskbar button, a, .title-bar-controls button {
      cursor: var(--star-cursor) !important;
    }

    .top-bar-wrapper {
      position: absolute;
      top: max(6px, env(safe-area-inset-top, 6px));
      left: max(6px, var(--safe-left));
      right: max(6px, var(--safe-right));
      z-index: 50; display: flex; flex-direction: column; background: transparent;
      border: none; pointer-events: none;
    }
    body.admin-mode .top-bar-wrapper {
      background: #c0c0c0; border: 2px outset #fff; padding: 3px;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.4); pointer-events: auto;
    }
    .top-actions-viewport {
      display: flex; gap: 4px; overflow-x: hidden; white-space: nowrap; pointer-events: auto;
    }
    .top-actions-viewport button {
      flex-shrink: 0; font-size: 11px; padding: 2px 6px; cursor: pointer; height: 25px;
    }
    #authBtn { pointer-events: auto; align-self: flex-start; }

    .desktop {
      position: absolute; top: 50px;
      left: max(0px, var(--safe-left)); right: max(0px, var(--safe-right));
      bottom: var(--taskbar-h); overflow: hidden;
    }

    .icon-wrapper {
      position: absolute; width: 76px;
      display: flex; flex-direction: column; align-items: center;
      cursor: var(--star-cursor); text-align: center;
      color: white; text-shadow: 1px 1px 2px black;
      padding: 3px; border-radius: 2px; touch-action: none;
    }
    .icon-wrapper.selected {
      background: rgba(0, 0, 128, 0.45); outline: 1px dotted #ffff00;
    }
    .icon-wrapper.selected span { background: #000080; color: #fff; }

    .icon-art-box {
      position: relative; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
    }
    .icon-art-box .base-img { width: 44px; height: 44px; object-fit: contain; pointer-events: none; }
    .icon-art-box .custom-cover-badge {
      position: absolute; width: 23px; height: 23px; object-fit: cover;
      border: 1.5px solid #fff; border-radius: 3px;
      bottom: 0; right: 0; box-shadow: 1px 1px 4px rgba(0,0,0,0.6); pointer-events: none;
    }
    .icon-wrapper span {
      font-size: 11px; padding: 1px 3px; margin-top: 3px; word-break: break-all; pointer-events: none;
    }

    /* 視窗樣式 (優化高度自適應) */
    .win-modal {
      position: fixed; display: none; z-index: 100;
      box-shadow: 2px 2px 14px rgba(0,0,0,0.6);
      width: 95vw; max-width: 480px; min-width: 280px; min-height: 200px;
      resize: both; overflow: hidden;
    }
    .win-modal .title-bar { cursor: move; position: relative; }
    .win-modal .title-bar-controls {
      position: relative; z-index: 1000; display: flex; gap: 2px; pointer-events: auto !important;
    }
    .win-modal .title-bar-controls button {
      cursor: var(--star-cursor) !important; pointer-events: auto !important;
    }
    .win-modal .window-body {
      height: calc(100% - 32px); max-height: calc(100% - 32px); overflow-y: auto; padding: 0;
    }

    .win-modal.maximized {
      top: 0 !important; left: 0 !important; transform: none !important;
      width: 100vw !important; max-width: 100vw !important;
      height: calc(100vh - var(--taskbar-h)) !important;
      z-index: 1500 !important; resize: none !important;
    }

    #embedded-cd-win {
      height: 82vh;
      max-height: calc(100vh - var(--taskbar-h) - 20px);
    }
    .embedded-player-container {
      width: 100%; height: 100%; background: #000;
    }
    .embedded-player-container iframe {
      width: 100%; height: 100%; border: none;
    }

    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--taskbar-h); min-height: 38px;
      background: #c0c0c0; border-top: 2px solid #fff;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding-top: 4px; padding-left: max(8px, var(--safe-left));
      padding-right: max(14px, var(--safe-right)); padding-bottom: max(6px, var(--safe-bottom));
      z-index: 9999;
    }
    .taskbar-left { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1; }
    .task-item-btn { font-size: 11px; padding: 2px 6px; height: 26px; white-space: nowrap; }
    .taskbar-right { font-size: 11px; display: flex; align-items: center; padding-left: 8px; flex-shrink: 0; height: 26px; }
    .taskbar-right a { color: #000; text-decoration: none; font-weight: bold; border-bottom: 1px dotted #555; }

    .admin-only { display: none !important; }
    body.admin-mode .admin-only { display: inline-flex !important; }
  </style>
</head>
<body>

  <div class="top-bar-wrapper">
    <div class="top-actions-viewport">
      <button id="authBtn" onclick="toggleAdmin()">🔒 管理員</button>
      <button class="admin-only" onclick="openWinterCdPlayerWindow()">💿 開啟 CD 播放器</button>
    </div>
  </div>

  <div class="desktop" id="desktopContainer"></div>

  <!-- 嵌入式 CD 播放器視窗 (支援雙擊標題列最大化/還原) -->
  <div id="embedded-cd-win" class="window win-modal" onclick="event.stopPropagation()">
    <div class="title-bar" onmousedown="dragElement(this.parentElement, event)" ondblclick="toggleMaximize('embedded-cd-win', event)">
      <div class="title-bar-text">💿 WINTER CD PLAYER</div>
      <div class="title-bar-controls">
        <button type="button" aria-label="Minimize" onclick="minimizeWindow('embedded-cd-win', 'CD Player', event)"></button>
        <button type="button" aria-label="Maximize" onclick="toggleMaximize('embedded-cd-win', event)"></button>
        <button type="button" aria-label="Close" onclick="closeEmbeddedCdWindow(event)"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="embedded-player-container">
        <iframe id="embeddedCdIframe" src="" allow="autoplay; accelerometer; gyroscope"></iframe>
      </div>
    </div>
  </div>

  <div class="taskbar">
    <div class="taskbar-left">
      <button type="button" onclick="goHome()" style="font-weight:bold; height:26px;">⭐️ HOME</button>
      <div id="taskbarItems" style="display:flex; gap:3px;"></div>
    </div>
    <div class="taskbar-right">
      <a href="https://www.instagram.com/winter_tst" target="_blank">Copyright © : winter_tst</a>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin";
    let isAdmin = false;

    const MASTER_CONFIG = {
      "items": [
        {
          "id": "winter_cd_standalone_entry",
          "name": "Winter Playlist",
          "coverBadge": "https://lh3.googleusercontent.com/d/1R3m2fbip6zXRkHx0ujIQtW4VcoOkDnax",
          "url": "https://u11150003-arch.github.io/winter-cd-player/",
          "pos": { "x": 16, "y": 20 }
        }
      ]
    };

    function openWinterCdPlayerWindow() {
      const item = MASTER_CONFIG.items[0];
      const iframe = document.getElementById('embeddedCdIframe');
      if (iframe.src !== item.url) iframe.src = item.url;
      openWindow('embedded-cd-win');
    }

    function closeEmbeddedCdWindow(e) {
      if (e) e.stopPropagation();
      document.getElementById('embeddedCdIframe').src = '';
      closeWindow('embedded-cd-win', e);
    }

    function toggleAdmin() {
      const input = prompt("請輸入管理員密碼：");
      if (input === ADMIN_PASSWORD) {
        isAdmin = !isAdmin;
        document.body.classList.toggle('admin-mode', isAdmin);
      }
    }

    function renderDesktop() {
      const container = document.getElementById('desktopContainer');
      container.innerHTML = '';
      MASTER_CONFIG.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'icon-wrapper';
        div.style.left = item.pos.x + "px";
        div.style.top = item.pos.y + "px";
        div.innerHTML = `
          <div class="icon-art-box">
            <img src="https://win98icons.alexmeub.com/icons/png/cd_drive-5.png" class="base-img">
            <img src="${item.coverBadge}" class="custom-cover-badge">
          </div>
          <span>${item.name}</span>
        `;
        div.onclick = openWinterCdPlayerWindow;
        container.appendChild(div);
      });
    }

    let highestZ = 200;
    const windowRestoreBounds = {};
    const minimizedWindows = {};

    function openWindow(id) {
      const win = document.getElementById(id);
      win.style.display = 'block';
      win.style.zIndex = ++highestZ;

      // 嚴格還原成正常比例高度
      if (!win.classList.contains('maximized')) {
        const prev = windowRestoreBounds[id];
        if (prev) {
          win.style.top = prev.top;
          win.style.left = prev.left;
          win.style.height = prev.height;
          win.style.width = prev.width;
        } else {
          win.style.top = '50%';
          win.style.left = '50%';
          win.style.transform = 'translate(-50%, -50%)';
          win.style.height = '82vh';
          win.style.width = '95vw';
        }
      }
      delete minimizedWindows[id];
      updateTaskbar();
    }

    function closeWindow(id, e) {
      if (e) e.stopPropagation();
      const win = document.getElementById(id);
      win.style.display = 'none';
      win.classList.remove('maximized');
      delete minimizedWindows[id];
      updateTaskbar();
    }

    function minimizeWindow(id, title, e) {
      if (e) e.stopPropagation();
      const win = document.getElementById(id);
      win.style.display = 'none';
      minimizedWindows[id] = title;
      updateTaskbar();
    }

    function toggleMaximize(id, e) {
      if (e) e.stopPropagation();
      const win = document.getElementById(id);
      if (win.classList.contains('maximized')) {
        win.classList.remove('maximized');
        win.style.height = '82vh';
        win.style.width = '95vw';
        win.style.top = '50%';
        win.style.left = '50%';
        win.style.transform = 'translate(-50%, -50%)';
      } else {
        windowRestoreBounds[id] = {
          top: win.style.top, left: win.style.left,
          width: win.style.width, height: win.style.height
        };
        win.classList.add('maximized');
      }
    }

    function updateTaskbar() {
      const container = document.getElementById('taskbarItems');
      container.innerHTML = '';
      for (const [winId, title] of Object.entries(minimizedWindows)) {
        const btn = document.createElement('button');
        btn.className = 'task-item-btn';
        btn.innerText = `💿 ${title}`;
        btn.onclick = () => openWindow(winId);
        container.appendChild(btn);
      }
    }

    function dragElement(elmnt, event) {
      if (elmnt.classList.contains('maximized')) return;
      if (event.target.closest('.title-bar-controls')) return;

      elmnt.style.zIndex = ++highestZ;
      if (elmnt.style.transform && elmnt.style.transform.includes('translate')) {
        const rect = elmnt.getBoundingClientRect();
        elmnt.style.transform = 'none';
        elmnt.style.top = rect.top + 'px';
        elmnt.style.left = rect.left + 'px';
      }

      let pos1 = 0, pos2 = 0, pos3 = event.clientX, pos4 = event.clientY;
      document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
      document.onmousemove = (e) => {
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      };
    }

    function goHome() {
      document.querySelectorAll('.win-modal').forEach(win => win.style.display = 'none');
    }

    renderDesktop();
  </script>
</body>
</html>
